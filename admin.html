<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Race Krono - Painel Admin</title>
    <style>
        :root { --amarelo: #f1c40f; --bg: #121212; --card: #1e1e1e; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: var(--card); padding: 30px; border-radius: 12px; border-top: 5px solid var(--amarelo); text-align: center; }
        h1 { color: var(--amarelo); margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 15px 0; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-upload { background: #3498db; color: white; }
        .btn-editor { background: var(--amarelo); color: black; }
        .btn-clear { background: #e74c3c; color: white; }
        #status { margin-top: 15px; font-weight: bold; color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏁 Painel Administrativo</h1>
    <p>Controle global e distribuição das planilhas de Rally</p>
    
    <hr style="border-color:#333; margin: 20px 0;">

    <button class="btn btn-editor" onclick="window.location.href='editor.html'">🛠️ Abrir Editor de Planilhas</button>
    
    <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📂 Enviar Planilha (.JSON) para Pilotos</button>
    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importarPlanilhaParaFirebase(this)">

    <button class="btn btn-clear" onclick="limparProvaAtual()">🗑️ Limpar Prova do Servidor</button>

    <div id="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
        authDomain: "cronometro-rally.firebaseapp.com",
        databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
        projectId: "cronometro-rally",
        storageBucket: "cronometro-rally.firebasestorage.app",
        messagingSenderId: "341731891354",
        appId: "1:341731891354:web:d0c34265be68015e98a723"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database(app);

    function importarPlanilhaParaFirebase(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dados = JSON.parse(e.target.result);
                
                if(!Array.isArray(dados)) {
                    alert("Estrutura inválida. O arquivo precisa ser uma lista válida.");
                    return;
                }

                // CORREÇÃO: Garante o ordenamento cronológico pelo index e NUNCA por km
                dados.sort((a, b) => (a.ordemSequencial || 0) - (b.ordemSequencial || 0));

                document.getElementById("status").innerText = "Enviando dados para nuvem...";
                
                db.ref('prova_atual').set(dados)
                    .then(() => {
                        document.getElementById("status").innerText = "✅ Planilha enviada e ativa em tempo real!";
                        input.value = ""; 
                    })
                    .catch(err => {
                        document.getElementById("status").innerText = "❌ Erro ao enviar para o Firebase.";
                        console.error(err);
                    });

            } catch(err) {
                alert("Erro ao ler ou processar o JSON.");
            }
        };
        reader.readAsText(file);
    }

    function limparProvaAtual() {
        if(confirm("Deseja desativar e remover a prova atual de todos os pilotos?")) {
            db.ref('prova_atual').remove()
                .then(() => {
                    document.getElementById("status").innerText = "🗑️ Nenhuma prova rodando no servidor.";
                });
        }
    }
</script>
</body>
</html>
