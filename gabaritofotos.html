<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Gabarito de Fotos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Cadastro de Gabarito de Fotos</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Nome da Prova:</label>
            <input type="text" id="nomeProva" class="w-full p-2 border rounded" placeholder="Ex: Rally dos Sertões 2026">
        </div>

        <div class="mb-4">
            <h2 class="text-xl font-semibold text-gray-700 mb-2">Adicionar Posto (PC)</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2">
                <input type="text" id="postoId" class="p-2 border rounded" placeholder="ID/Número do Posto (Ex: PC-01)">
                <input type="text" id="postoDesc" class="p-2 border rounded" placeholder="Descrição da Referência">
                <input type="number" id="postoPontos" class="p-2 border rounded" value="10" placeholder="Pontos">
            </div>
            <button id="btnAdicionarPonto" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Adicionar à Lista</button>
        </div>

        <div class="mb-4">
            <h3 class="font-semibold text-gray-700 mb-2">Pontos Adicionados:</h3>
            <ul id="listaGabarito" class="border p-2 rounded bg-gray-50 min-h-[80px]">
                <li class="text-gray-400 text-sm">Nenhum ponto adicionado.</li>
            </ul>
        </div>

        <button id="btnSalvarProva" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Salvar Prova e Gabarito</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            storageBucket: "cronometro-rally.firebasestorage.app",
            messagingSenderId: "341731891354",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let pontosTemporarios = [];

        document.getElementById('btnAdicionarPonto').addEventListener('click', () => {
            const id = document.getElementById('postoId').value.trim();
            const descricao = document.getElementById('postoDesc').value.trim();
            const pontos = document.getElementById('postoPontos').value.trim();

            if (!id || !descricao) {
                alert('Preencha o ID e a descrição do posto.');
                return;
            }

            pontosTemporarios.push({ id, descricao, pontos: Number(pontos) });
            renderizarLista();

            document.getElementById('postoId').value = '';
            document.getElementById('postoDesc').value = '';
            document.getElementById('postoId').focus();
        });

        function renderizarLista() {
            const lista = document.getElementById('listaGabarito');
            if (pontosTemporarios.length === 0) {
                lista.innerHTML = '<li class="text-gray-400 text-sm">Nenhum ponto adicionado.</li>';
                return;
            }
            lista.innerHTML = '';
            pontosTemporarios.forEach((p, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center py-1 border-b";
                li.innerHTML = `<span><strong>${p.id}</strong> - ${p.descricao} (${p.pontos} pts)</span>
                                <button onclick="remover(${index})" class="text-red-500 text-xs">Remover</button>`;
                lista.appendChild(li);
            });
        }

        window.remover = function(index) {
            pontosTemporarios.splice(index, 1);
            renderizarLista();
        };

        document.getElementById('btnSalvarProva').addEventListener('click', async () => {
            const nomeProva = document.getElementById('nomeProva').value.trim();
            if (!nomeProva || pontosTemporarios.length === 0) {
                alert('Informe o nome da prova e adicione ao menos um ponto.');
                return;
            }

            try {
                const novaProvaRef = push(ref(db, 'provas_fotos'));
                await set(novaProvaRef, {
                    nome: nomeProva,
                    gabarito: pontosTemporarios,
                    criadoEm: Date.now()
                });
                alert('Prova salva com sucesso!');
                pontosTemporarios = [];
                document.getElementById('nomeProva').value = '';
                renderizarLista();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert('Erro ao salvar prova.');
            }
        });
    </script>
</body>
</html>
