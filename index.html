<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Race Krono - Navegação de Prova</title>
    <style>
        :root {
            --amarelo: #f1c40f;
            --bg: #121212;
            --card: #1e1e1e;
            --texto: #ffffff;
            --borda: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background: var(--bg);
            color: var(--texto);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PAINEL DO ODÔMETRO (TOPO) */
        .painel-odometros {
            background: #000000;
            border-bottom: 4px solid var(--amarelo);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container-parcial {
            text-align: center;
        }

        .label-odometro {
            font-size: 14px;
            color: var(--amarelo);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Odômetro Parcial - Gigante para visualização rápida */
        .odometros-valores {
            font-size: 84px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            text-shadow: 0px 0px 10px rgba(241, 196, 15, 0.2);
            font-variant-numeric: tabular-nums;
        }

        /* Odômetro Total - Menor, logo abaixo */
        .container-total {
            margin-top: 5px;
            font-size: 24px;
            font-weight: bold;
            color: #888888;
            font-variant-numeric: tabular-nums;
        }
        
        .container-total span {
            color: var(--amarelo);
        }

        /* Botões rápidos de ajuste fino do odômetro */
        .ajustes-odometro {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            width: 100%;
            max-width: 400px;
        }

        .btn-ajuste {
            flex: 1;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: active 0.1s;
        }

        .btn-ajuste:active {
            background: var(--amarelo);
            color: black;
        }

        /* ÁREA DA PLANILHA (ROADBOOK) */
        .roadbook-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            background: #151515;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tr {
            border-bottom: 2px solid var(--borda);
            transition: background 0.3s;
        }

        /* Linha atual em foco na tela */
        tr.linha-atual {
            background: rgba(241, 196, 15, 0.15);
            border-left: 8px solid var(--amarelo);
        }

        /* Indicação visual de linha que gera zerada */
        tr.linha-zera {
            border-left: 8px solid #e74c3c;
        }

        td {
            padding: 15px 10px;
            text-align: center;
            vertical-align: middle;
            font-size: 20px;
        }

        .col-km {
            width: 25%;
            font-size: 28px;
            font-weight: bold;
            color: var(--amarelo);
            font-variant-numeric: tabular-nums;
        }

        .col-tulipa {
            width: 30%;
            background: #ffffff;
            padding: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .col-tulipa img {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
        }

        .col-obs {
            width: 45%;
            font-size: 18px;
            text-align: left;
            padding-left: 20px;
            color: #ffffff;
            font-weight: bold;
        }

        /* MENU DE CONTROLES INFERIORES */
        .menu-inferior {
            background: #000;
            border-top: 3px solid #333;
            padding: 10px;
            display: flex;
            gap: 10px;
            justify-content: space-around;
        }

        .btn-menu {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-verde { background: #2ecc71; color: white; }
        .btn-vermelho { background: #e74c3c; color: white; }
        .btn-cinza { background: #333; color: white; }

        /* Estilo do Alerta Sonoro de Zerada */
        #status-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            z-index: 999;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: piscar 0.5s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="status-alert">⚠️ ODÔMETRO ZERADO!</div>

<!-- PAINEL DOS ODÔMETROS -->
<div class="painel-odometros">
    <div class="container-parcial">
        <div class="label-odometro">Parcial (Trecho)</div>
        <div class="odometros-valores" id="displayParcial">0.000</div>
    </div>
    
    <div class="container-total">
        TOTAL: <span id="displayTotal">0.000</span> KM
    </div>

    <!-- Ajustes finos rápidos para o piloto bater o dedo no painel -->
    <div class="ajustes-odometro">
        <button class="btn-ajuste" onclick="ajustarParcial(-0.010)">-10m</button>
        <button class="btn-ajuste" onclick="ajustarParcial(0.010)">+10m</button>
        <button class="btn-ajuste" style="background: #c0392b;" onclick="zerarParcialManual()">Zerar Parcial</button>
    </div>
</div>

<!-- CONTAINER DA PLANILHA (ROADBOOK) -->
<div class="roadbook-container" id="roadbook">
    <table id="tabelaNavegacao">
        <tbody>
            <!-- Linhas inseridas dinamicamente pelo arquivo carregado -->
        </tbody>
    </table>
</div>

<!-- CONTROLES DE SIMULAÇÃO / TESTE DE GPS -->
<div class="menu-inferior">
    <input type="file" id="arquivoInput" style="display:none" accept=".json" onchange="importarPlanilha(this)">
    <button class="btn-menu btn-cinza" onclick="document.getElementById('arquivoInput').click()">Carregar Planilha</button>
    <button class="btn-menu btn-verde" id="btnGPS" onclick="alternarGPS()">Iniciar GPS</button>
    <button class="btn-menu btn-vermelho" onclick="limparCorrida()">Resetar Prova</button>
</div>

<script>
    // Variáveis de Controle dos Odômetros
    let odometroTotal = 0.000;      // Controla a rolagem e posição da planilha
    let odometroParcial = 0.000;    // Controla o odômetro gigante visualizado pelo piloto
    let ultimoKmZeradoAbsoluto = 0.000; // Guarda onde foi o último ponto de reset do odômetro parcial
    
    let planilha = [];              // Guarda os dados carregados da planilha
    let watchID = null;             // Guarda o watchPosition do GPS
    let ultimaCoordenada = null;    // Para cálculo de distância por fórmula Haversine

    // Inicialização da Página
    window.onload = function() {
        restaurarEstadoNavegacao();
    };

    // Atualiza os displays dos odômetros na tela
    function atualizarDisplays() {
        document.getElementById('displayParcial').innerText = odometroParcial.toFixed(3);
        document.getElementById('displayTotal').innerText = odometroTotal.toFixed(3);
    }

    // AJUSTES MANUAIS DO ODÔMETRO PARCIAL
    function ajustarParcial(valor) {
        odometroParcial += valor;
        if (odometroParcial < 0) odometroParcial = 0;
        
        // Ajustamos proporcionalmente o total para manter a sincronia física
        odometroTotal += valor;
        if (odometroTotal < 0) odometroTotal = 0;

        atualizarDisplays();
        atualizarPosicaoPlanilha();
        salvarEstadoNavegacao();
    }

    function zerarParcialManual() {
        if (confirm("Deseja zerar manualmente o odômetro parcial?")) {
            ultimoKmZeradoAbsoluto = odometroTotal;
            odometroParcial = 0.000;
            atualizarDisplays();
            salvarEstadoNavegacao();
            dispararAlertaVisual();
        }
    }

    // IMPORTAR PLANILHA (JSON EXPORTADO DO EDITOR)
    function importarPlanilha(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                planilha = JSON.parse(e.target.result);
                // Ordena por garantia pelo KM absoluto
                planilha.sort((a, b) => a.km - b.km);
                
                // Salva a planilha importada no localStorage para persistência de falhas
                localStorage.setItem('racekrono_planilha_ativa', JSON.stringify(planilha));
                
                renderizarPlanilha();
            } catch(err) {
                alert("Erro ao ler planilha JSON válida.");
            }
        };
        reader.readAsText(file);
    }

    // RENDERIZAÇÃO DA PLANILHA NA TELA
    function renderizarPlanilha() {
        const tbody = document.querySelector("#tabelaNavegacao tbody");
        tbody.innerHTML = "";

        if (planilha.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="color: #777; padding: 50px;">Nenhuma planilha ativa carregada.</td></tr>`;
            return;
        }

        planilha.forEach((ponto, index) => {
            const tr = document.createElement("tr");
            tr.id = `referencia-${index}`;
            if (ponto.zera) {
                tr.classList.add("linha-zera");
            }

            tr.innerHTML = `
                <td class="col-km">${parseFloat(ponto.km).toFixed(3)}</td>
                <td>
                    <div class="col-tulipa">
                        <img src="${ponto.tulipa}" alt="Tulipa">
                    </div>
                </td>
                <td class="col-obs">
                    ${ponto.obs}
                    ${ponto.zera ? '<br><span style="color: #e74c3c; font-size: 13px;">[ZERAR ODÔMETRO]</span>' : ''}
                </td>
            `;
            tbody.appendChild(tr);
        });

        atualizarPosicaoPlanilha();
    }

    // ATUALIZAR POSIÇÃO DA PLANILHA E DETECTAR ZERADAS AUTOMÁTICAS
    function atualizarPosicaoPlanilha() {
        if (planilha.length === 0) return;

        let indiceAtual = 0;

        // Varre a planilha procurando a tulipa mais próxima correspondente ao KM TOTAL
        for (let i = 0; i < planilha.length; i++) {
            if (odometroTotal >= planilha[i].km) {
                indiceAtual = i;
            } else {
                break;
            }
        }

        // Remove destaques anteriores
        document.querySelectorAll("#tabelaNavegacao tbody tr").forEach(tr => {
            tr.classList.remove("linha-atual");
        });

        // Adiciona destaque na linha ativa
        const linhaAtiva = document.getElementById(`referencia-${indiceAtual}`);
        if (linhaAtiva) {
            linhaAtiva.classList.add("linha-atual");
            
            // Foca o scroll automático na linha ativa
            linhaAtiva.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // DETECTAR SE A LINHA ATUAL PEDE ZERADA AUTOMÁTICA
        const pontoAtual = planilha[indiceAtual];
        if (pontoAtual && pontoAtual.zera && ultimoKmZeradoAbsoluto !== pontoAtual.km) {
            // Realiza a zerada automática do parcial
            ultimoKmZeradoAbsoluto = pontoAtual.km;
            odometroParcial = 0.000;
            
            dispararAlertaVisual();
            atualizarDisplays();
            salvarEstadoNavegacao();
        }
    }

    // ALERTA VISUAL RÁPIDO DE ZERADA
    function dispararAlertaVisual() {
        const alerta = document.getElementById("status-alert");
        alerta.style.display = "block";
        setTimeout(() => { alerta.style.display = "none"; }, 3000);
    }

    // PERSISTÊNCIA DO ESTADO DE CORRIDA (PROTEÇÃO CONTRA ATUALIZAÇÃO DA PÁGINA)
    function salvarEstadoNavegacao() {
        const estado = {
            odometroTotal: odometroTotal,
            ultimoKmZeradoAbsoluto: ultimoKmZeradoAbsoluto,
            timestamp: Date.now()
        };
        localStorage.setItem('racekrono_estado_corrida', JSON.stringify(estado));
    }

    function restaurarEstadoNavegacao() {
        // Primeiro, restaura a planilha se houver
        const planilhaSalva = localStorage.getItem('racekrono_planilha_ativa');
        if (planilhaSalva) {
            planilha = JSON.parse(planilhaSalva);
            renderizarPlanilha();
        }

        // Restaura as variáveis dos odômetros
        const estadoSalvo = localStorage.getItem('racekrono_estado_corrida');
        if (estadoSalvo) {
            const estado = JSON.parse(estadoSalvo);
            
            // Aceita o backup se tiver menos de 12 horas para evitar erros de provas passadas
            if (Date.now() - estado.timestamp < 12 * 60 * 60 * 1000) {
                odometroTotal = estado.odometroTotal;
                ultimoKmZeradoAbsoluto = estado.ultimoKmZeradoAbsoluto;
                
                // O parcial é calculado de forma segura a partir da diferença
                odometroParcial = odometroTotal - ultimoKmZeradoAbsoluto;
                if (odometroParcial < 0) odometroParcial = 0;
                
                atualizarDisplays();
                atualizarPosicaoPlanilha();
                console.log("Recuperado com sucesso do backup!");
            }
        }
    }

    function limparCorrida() {
        if (confirm("Isso apagará o progresso atual do odômetro e redefinirá tudo. Confirmar?")) {
            localStorage.removeItem('racekrono_estado_corrida');
            odometroTotal = 0.000;
            odometroParcial = 0.000;
            ultimoKmZeradoAbsoluto = 0.000;
            atualizarDisplays();
            atualizarPosicaoPlanilha();
        }
    }

    // ENGENHARIA DE RASTREAMENTO GPS (CÁLCULO EXTREMAMENTE PRECISO)
    function alternarGPS() {
        const btn = document.getElementById("btnGPS");
        
        if (watchID !== null) {
            navigator.geolocation.clearWatch(watchID);
            watchID = null;
            ultimaCoordenada = null;
            btn.innerText = "Iniciar GPS";
            btn.style.background = "#2ecc71";
        } else {
            if (!navigator.geolocation) {
                alert("GPS não suportado neste aparelho.");
                return;
            }

            btn.innerText = "Desativar GPS";
            btn.style.background = "#e74c3c";

            watchID = navigator.geolocation.watchPosition(
                processarMovimentoGPS,
                (erro) => console.log("Erro de GPS: ", erro.message),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }
    }

    function processarMovimentoGPS(position) {
        // Ignora coordenadas imprecisas demais de antenas de celular
        if (position.coords.accuracy > 25) return;

        if (ultimaCoordenada !== null) {
            const distKM = calcularDistanciaHaversine(
                ultimaCoordenada.latitude, ultimaCoordenada.longitude,
                position.coords.latitude, position.coords.longitude
            );

            // Filtro para ruídos de GPS estático (parado sob árvores, etc)
            if (distKM > 0.002) { 
                odometroTotal += distKM;
                odometroParcial = odometroTotal - ultimoKmZeradoAbsoluto;
                if (odometroParcial < 0) odometroParcial = 0;

                atualizarDisplays();
                atualizarPosicaoPlanilha();
                salvarEstadoNavegacao();
            }
        }
        ultimaCoordenada = position.coords;
    }

    // Fórmula Matemática Haversine para cálculo preciso de coordenadas GPS
    function calcularDistanciaHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371; // Raio médio da Terra em KM
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }
</script>
</body>
</html>
