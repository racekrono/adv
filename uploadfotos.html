<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio de Fotos - Competidor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Painel de Envio de Fotos</h1>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Selecione a Prova:</label>
            <select id="selectProva" class="w-full border rounded px-3 py-2 bg-white">
                <option value="">Carregando provas...</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Número da Moto / Competidor:</label>
            <input type="text" id="numCompetidor" class="w-full border rounded px-3 py-2" placeholder="Ex: 42">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Posto / PC Referente:</label>
            <input type="text" id="numPosto" class="w-full border rounded px-3 py-2" placeholder="Ex: PC-01">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Foto do Posto:</label>
            <input type="file" id="inputFoto" accept="image/*" capture="environment" class="w-full border rounded px-3 py-2 bg-gray-50">
        </div>

        <div id="previewContainer" class="mb-4 hidden">
            <p class="text-sm font-semibold text-gray-600 mb-1">Pré-visualização:</p>
            <img id="imgPreview" class="w-full h-48 object-cover rounded border" alt="Preview">
        </div>

        <button id="btnEnviar" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 font-bold text-lg">Enviar Foto para Análise</button>
    </div>

    <!-- Firebase SDKs (Compat / Modular Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            storageBucket: "cronometro-rally.firebasestorage.app",
            messagingSenderId: "341731891354",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let imagemBase64 = "";

        // Carregar provas disponíveis
        async function carregarProvas() {
            const select = document.getElementById('selectProva');
            try {
                const snapshot = await get(ref(db, 'provas_fotos'));
                if (snapshot.exists()) {
                    select.innerHTML = '<option value="">Selecione...</option>';
                    snapshot.forEach((childSnapshot) => {
                        const prova = childSnapshot.val();
                        const opt = document.createElement('option');
                        opt.value = childSnapshot.key;
                        opt.textContent = prova.nome;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Nenhuma prova cadastrada</option>';
                }
            } catch (error) {
                console.error("Erro ao carregar provas:", error);
                select.innerHTML = '<option value="">Erro ao carregar provas</option>';
            }
        }

        carregarProvas();

        // Converter imagem para Base64 para armazenamento direto no Realtime Database
        document.getElementById('inputFoto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    imagemBase64 = uploadEvent.target.result;
                    document.getElementById('imgPreview').src = imagemBase64;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('btnEnviar').addEventListener('click', async () => {
            const provaId = document.getElementById('selectProva').value;
            const competidor = document.getElementById('numCompetidor').value.trim();
            const posto = document.getElementById('numPosto').value.trim();

            if (!provaId || !competidor || !posto || !imagemBase64) {
                alert('Preencha todos os campos e selecione uma foto.');
                return;
            }

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = "Enviando...";

            try {
                const enviosRef = push(ref(db, 'envios_competidores'));
                await set(enviosRef, {
                    provaId: provaId,
                    competidor: competidor,
                    posto: posto,
                    imagem: imagemBase64,
                    status: 'pendente',
                    enviadoEm: Date.now()
                });

                alert('Foto enviada com sucesso para o juiz!');
                // Limpar formulário
                document.getElementById('numCompetidor').value = '';
                document.getElementById('numPosto').value = '';
                document.getElementById('inputFoto').value = '';
                document.getElementById('imgPreview').src = '';
                document.getElementById('previewContainer').classList.add('hidden');
                imagemBase64 = "";
            } catch (error) {
                console.error("Erro ao enviar foto:", error);
                alert('Erro ao enviar foto. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar Foto para Análise";
            }
        });
    </script>
</body>
</html>
