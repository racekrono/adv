<script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);

        // Expor para boot.js (módulo ES)
        window.__rk = window.__rk || {};
        window.__rk.firebase = firebase;
        window.__rk.db = db;

        let wakeLock = null;
        let watchID = null;
        let odoTotal = 0;
        let ultimaPos = null;
        let ultimoIndiceAtivo = -1;
        let audioCtx = null;

        function obterAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function tocarBip(frequencia, duracao, volume = 0.1) {
            try {
                const ctx = obterAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequencia, ctx.currentTime);
                gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duracao);
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + duracao);
                oscillator.onended = () => {
                    oscillator.disconnect();
                    gainNode.disconnect();
                };
            } catch (e) { console.error(e); }
        }

        const somClique = () => tocarBip(2000, 0.08, 0.1);
        const somTrocaReferencia = () => tocarBip(1200, 0.25, 0.15);

        const btnMenu = document.getElementById('btnMenu');
        const menuOpcoes = document.getElementById('menuOpcoes');

        btnMenu.onclick = (e) => {
            e.stopPropagation();
            menuOpcoes.style.display = menuOpcoes.style.display === 'block' ? 'none' : 'block';
        };

        window.onclick = () => {
            menuOpcoes.style.display = 'none';
        };

        function escutarLogoffRemoto() {
            try {
                db.ref('configuracoes/comandoLogoff').on('value', (snap) => {
                    const timestampLogoff = snap.val();
                    const tempoLogin = localStorage.getItem('rally_timestamp_login') || 0;
                    if (timestampLogoff && timestampLogoff > parseInt(tempoLogin) && localStorage.getItem('rally_carro_ativo')) {
                        encerrarSessaoRemoto();
                    }
                });
            } catch (e) { console.warn('[Firebase] Falha ao escutar comando de logoff:', e); }
        }

        function carregarRoadbook() {
            const rbList = document.getElementById('roadbookList');

            // 1. TENTA CARREGAR DO CACHE LOCAL IMEDIATAMENTE (Offline-First)
            try {
                const planilhaSalva = localStorage.getItem('rally_planilha_cache');
                if (planilhaSalva) {
                    const dadosLocais = JSON.parse(planilhaSalva);
                    if (dadosLocais && dadosLocais.length) {
                        renderizarRoadbook(dadosLocais);
                        console.log('[PWA] Planilha offline carregada do cache local.');
                    }
                }
            } catch (e) {
                console.error('[PWA] Erro ao ler planilha do localStorage:', e);
            }

            // 2. ESCUTA ATUALIZAÇÕES DO FIREBASE (Quando houver internet)
            try {
                db.ref('prova_atual').on('value', (snapshot) => {
                    const dados = snapshot.val();
                    if (!dados) {
                        if (!rbList.querySelector('.roadbook-item')) {
                            rbList.innerHTML = '<div style="padding:20px; color:#444; font-size:11px; text-align:center;">PLANILHA NÃO DISPONÍVEL</div>';
                        }
                        return;
                    }
                    
                    renderizarRoadbook(dados);
                    
                    try {
                        localStorage.setItem('rally_planilha_cache', JSON.stringify(dados));
                    } catch (e) {
                        console.error('[PWA] Não foi possível salvar o cache da planilha:', e);
                    }

                    if (window.__rk && window.__rk.salvarRoadbookLocal) {
                        window.__rk.salvarRoadbookLocal(dados);
                    }
                });
            } catch (e) { console.warn('[Firebase] Não pôde registrar listener online:', e); }
        }

        function renderizarRoadbook(dados) {
            const rbList = document.getElementById('roadbookList');
            rbList.innerHTML = '';
            dados.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'roadbook-item';
                div.id = 'rb-item-' + index;
                const imgUrl = item.tulipa || '';
                const obs = item.obs || '--';
                const km = parseFloat(item.km).toFixed(3);
                div.innerHTML = `
                    <div class="rb-col-km">${km}</div>
                    <div class="rb-col-tulipa">
                        ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="rb-col-obs">${obs}</div>
                `;
                rbList.appendChild(div);
            });
            atualizarScrollRoadbook();
        }

        function atualizarScrollRoadbook() {
            const itens = document.querySelectorAll('.roadbook-item');
            if (itens.length === 0) return;
            let proximoItemIdx = -1;

            itens.forEach((div, index) => {
                const kmItem = parseFloat(div.querySelector('.rb-col-km').innerText);
                div.classList.remove('rb-item-ativo');
                
                if (proximoItemIdx === -1 && odoTotal <= (kmItem + 0.001)) {
                    proximoItemIdx = index;
                }
            });

            if (proximoItemIdx !== -1) {
                if (proximoItemIdx !== ultimoIndiceAtivo) {
                    if (ultimoIndiceAtivo !== -1) somTrocaReferencia();
                    ultimoIndiceAtivo = proximoItemIdx;
                }
                const itemAlvo = document.getElementById('rb-item-' + proximoItemIdx);
                if (itemAlvo) {
                    itemAlvo.classList.add('rb-item-ativo');
                    itemAlvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function processarPontoGps(num, lat, lng, accuracy, kmh) {
            if (accuracy > 25) return;

            if (ultimaPos) {
                const dist = calcularDistancia(ultimaPos.lat, ultimaPos.lng, lat, lng);
                if (dist > 0.004) {
                    odoTotal += dist;
                    atualizarTelaOdo();
                    ultimaPos = { lat, lng };
                }
            } else {
                ultimaPos = { lat, lng };
            }

            document.getElementById('viewVel').innerText = kmh.toFixed(1);
            const dados = { lat, lng, vel: kmh, acc: accuracy, ts: Date.now() };

            if (window.__rk && window.__rk.registrarPontoGps) {
                window.__rk.registrarPontoGps(num, dados);
            } else {
                try {
                    db.ref('posicoes/' + num).set(dados);
                    db.ref('rastros/' + num).push(dados);
                } catch(e) { console.error('Erro ao enviar GPS:', e); }
            }
        }
        window.__rk = window.__rk || {};
        window.__rk.processarPontoGps = processarPontoGps;

        function iniciarFluxoRastreio(num) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('ativo').style.display = 'flex';
            document.getElementById('viewCarro').innerText = "Carro " + num;
            window.__rk.carroAtivo = num;
            solicitarWakeLock();
            escutarLogoffRemoto();

            try {
                db.ref(".info/connected").on("value", (snap) => {
                    const msg = document.getElementById('msgGps');
                    if (snap.val() === true) {
                        msg.innerText = "● TRANSMITINDO AO VIVO";
                        msg.classList.remove('status-offline');
                        if (window.__rk && window.__rk.drenarFila) window.__rk.drenarFila();
                    } else {
                        msg.innerText = "SEM INTERNET - DADOS PROTEGIDOS";
                        msg.classList.add('status-offline');
                    }
                });
            } catch (e) {
                const msg = document.getElementById('msgGps');
                msg.innerText = "SEM INTERNET - MODO OFFLINE";
                msg.classList.add('status-offline');
            }

            if (window.__rk && window.__rk.iniciarGpsNativo) {
                window.__rk.iniciarGpsNativo(num);
            } else {
                watchID = navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const speedMS = position.coords.speed || 0;
                    const kmh = Math.round(speedMS * 3.6);
                    processarPontoGps(num, lat, lng, accuracy, kmh);
                }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            }
        }
        window.__rk.iniciarFluxoRastreio = iniciarFluxoRastreio;
        window.__rk.carregarRoadbook = carregarRoadbook;

        document.getElementById('btnIniciar').onclick = async function() {
            const numRaw = document.getElementById('carro').value;
            const nomeRaw = document.getElementById('nome').value.trim();
            const cat = document.getElementById('categoria').value;
            const num = parseInt(numRaw);
            if(!nomeRaw || !numRaw) return alert("Preencha todos os campos!");
            try {
                const statusSnap = await db.ref('configuracoes/provaAberta').once('value');
                if (statusSnap.val() !== true) return alert("🚫 A prova está fechada.");

                const snapshot = await db.ref('competidores/' + num).once('value');
                if (snapshot.exists()) {
                    const existente = snapshot.val() || {};
                    const mesmoNome = (existente.nome || '').trim().toLowerCase() === nomeRaw.toLowerCase();
                    const carroLocal = localStorage.getItem('rally_carro_ativo');
                    const ehMinhaSessao = carroLocal && parseInt(carroLocal) === num;

                    if (!mesmoNome && !ehMinhaSessao) {
                        return alert("Este número de carro já existe!\n\nEscolha outro número ou peça ao organizador para liberar.");
                    }
                }

                somClique();

                await db.ref('competidores/' + num).set({ nome: nomeRaw, categoria: cat });
                localStorage.setItem('rally_carro_ativo', num);
                localStorage.setItem('rally_timestamp_login', Date.now());

                if (window.__rk && window.__rk.salvarSessao) {
                    await window.__rk.salvarSessao({ carro: num, nome: nomeRaw, categoria: cat, login: Date.now() });
                }

                iniciarFluxoRastreio(num);
                carregarRoadbook();
            } catch (e) { alert("Erro de conexão."); }
        };

        function alterarOdo(v) {
            odoTotal = Math.max(0, odoTotal + v);
            somClique();
            atualizarTelaOdo();
        }

        function zerarOdo() {
            if(confirm("Zerar odômetro?")) {
                odoTotal = 0;
                somClique();
                atualizarTelaOdo();
            }
        }

        function atualizarTelaOdo() {
            document.getElementById('displayOdo').innerText = odoTotal.toFixed(3);
            atualizarScrollRoadbook();
            if (window.__rk && window.__rk.salvarOdometro) {
                window.__rk.salvarOdometro(odoTotal);
            }
        }
        window.__rk.aplicarOdometroRestaurado = function(valor) {
            odoTotal = valor || 0;
            atualizarTelaOdo();
        };

        function ajusteManualOdo() {
            let n = prompt("Ajustar Odômetro (KM):", odoTotal.toFixed(3));
            if(n !== null) {
                let val = parseFloat(n.replace(',','.'));
                if(!isNaN(val)) {
                    odoTotal = Math.max(0, val);
                    somClique();
                    atualizarTelaOdo();
                }
            }
        }

        function encerrarSessao() {
            if (confirm("Deseja realmente sair da prova?")) {
                pararGps();
                limparTudo();
                location.reload();
            }
        }

        function encerrarSessaoRemoto() {
            pararGps();
            limparTudo();
            alert("A organização encerrou a sessão.");
            location.reload();
        }

        function pararGps() {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            if (window.__rk && window.__rk.pararGpsNativo) window.__rk.pararGpsNativo();
        }

        async function limparTudo() {
            localStorage.removeItem('rally_carro_ativo');
            localStorage.removeItem('rally_timestamp_login');
            if (window.__rk && window.__rk.limparOffline) {
                await window.__rk.limparOffline();
            }
        }

        async function enviarDatalogger() {
            const num = window.__rk.carroAtivo || localStorage.getItem('rally_carro_ativo');
            if (!num) return alert("Nenhuma sessão activa.");
            try {
                if (window.__rk && window.__rk.enviarDataloggerCompleto) {
                    const msg = await window.__rk.enviarDataloggerCompleto(num);
                    return alert(msg);
                }

                const snap = await db.ref('rastros/' + num).once('value');
                const pontos = [];
                snap.forEach(child => {
                    const p = child.val() || {};
                    if (typeof p.lat === 'number' && typeof p.lng === 'number') {
                        pontos.push({
                            lat: p.lat,
                            lng: p.lng,
                            vel: p.vel || 0,
                            acc: p.acc || 0,
                            ts: p.ts || Date.now()
                        });
                    }
                });

                if (pontos.length === 0) {
                    const atualSnap = await db.ref('posicoes/' + num).once('value');
                    const atual = atualSnap.val() || {};
                    if (typeof atual.lat === 'number' && typeof atual.lng === 'number') {
                        pontos.push({
                            lat: atual.lat,
                            lng: atual.lng,
                            vel: atual.vel || 0,
                            acc: atual.acc || 0,
                            ts: atual.ts || Date.now()
                        });
                    }
                }

                if (pontos.length === 0) return alert("Nenhum ponto de GPS para enviar.");

                const ts = Date.now();
                await db.ref(`rastros_completos/${num}/${ts}`).set({
                    enviadoEm: ts,
                    totalPontos: pontos.length,
                    pontos
                });

                alert(`✅ Datalogger enviado: ${pontos.length} pontos.`);
            } catch (e) {
                alert("Falha ao enviar datalogger: " + (e.message || e));
            }
        }

        function verRastro() {
            const num = window.__rk.carroAtivo || localStorage.getItem('rally_carro_ativo');
            if (!num) {
                alert("Você precisa iniciar a prova para visualizar seu rastro.");
                return;
            }
            const url = `https://racekrono.github.io/adv/rastropiloto.html?carro=${encodeURIComponent(num)}`;
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser) {
                window.Capacitor.Plugins.Browser.open({ url });
            } else {
                window.open(url, '_blank');
            }
        }

        // ============================================================
        // RESTAURAÇÃO DE SESSÃO (WEB PURO - COM CORREÇÃO OFFLINE)
        // ============================================================
        (function restaurarSessaoWeb() {
            function tentar() {
                if (document.getElementById('ativo').style.display === 'flex') return;
                const carro = localStorage.getItem('rally_carro_ativo');
                if (!carro) return;
                const num = parseInt(carro);
                if (!num) return;
                try {
                    // 1. CARREGA A PLANILHA DO CACHE INSTANTANEAMENTE
                    carregarRoadbook();
                    
                    // 2. INICIA O RASTREIO E INTERFACE SEM DEPENDER DO FIREBASE
                    iniciarFluxoRastreio(num);
                } catch (e) {
                    console.error('[restaurarSessaoWeb] falhou:', e);
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tentar);
            } else {
                tentar();
            }
        })();

        // ============================================================
        // PWA — registra Service Worker (habilita "Instalar app")
        // ============================================================
        (function registrarPWA() {
            if (!('serviceWorker' in navigator)) return;
            const h = location.hostname;
            const isPreview =
                h.startsWith('id-preview--') ||
                h.startsWith('preview--') ||
                h.endsWith('.lovableproject.com') ||
                h.endsWith('.lovableproject-dev.com') ||
                h.endsWith('.beta.lovable.dev') ||
                window.self !== window.top;
            if (isPreview) return;
            if (location.protocol !== 'https:' && h !== 'localhost') return;

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: '/adv/' }).catch((e) => {
                    console.warn('[PWA] SW falhou:', e);
                });
            });

            let deferredPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                window.__rk = window.__rk || {};
                window.__rk.instalarPWA = async () => {
                    if (!deferredPrompt) return alert('Instalação não disponível.\nNo iPhone: Compartilhar → Adicionar à Tela de Início.');
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                };
            });
        })();
    </script>
