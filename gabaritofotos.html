<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabarito Fotos - Rally</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase v9 Compat SDKs (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📸</span>
      <div>
        <h1 class="text-lg font-bold text-white">Admin - Cadastro de Gabarito de Fotos</h1>
        <p class="text-xs text-slate-400">Sistema Oficial de Rali</p>
      </div>
    </div>
    <button onclick="window.location.href='admin.html'" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg border border-slate-600 transition">⬅️ Voltar ao Admin</button>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- PASSO 1: INFORMAÇÕES GERAIS DA PROVA -->
    <section id="step-1" class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700 max-w-xl mx-auto">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-700">
        <span class="w-8 h-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-sm">1</span>
        <div>
          <h2 class="text-lg font-bold text-slate-200">Dados da Etapa / Prova</h2>
          <p class="text-xs text-slate-400">Defina o nome da gincana e o total de fotos/tarefas.</p>
        </div>
      </div>

      <form id="form-step-1" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-1">Nome da Prova / Etapa</label>
          <input type="text" id="nome-prova" required placeholder="Ex: Etapa 1 - Centro Histórico" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-1">Quantidade de Fotos / Tarefas</label>
          <input type="number" id="qtd-fotos" min="1" max="50" required placeholder="Ex: 5" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2">
          <span>Avançar para Upload das Fotos</span>
          <span>→</span>
        </button>
      </form>
    </section>

    <!-- PASSO 2: UPLOAD DAS FOTOS E REGRAS -->
    <section id="step-2" class="hidden space-y-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Configurando Prova</span>
          <h2 id="display-nome-prova" class="text-xl font-bold text-white">---</h2>
        </div>
        <button id="btn-voltar" type="button" class="text-sm text-indigo-400 hover:underline font-semibold">
          ← Voltar e alterar dados
        </button>
      </div>

      <form id="form-step-2" class="space-y-6">
        <div id="container-fotos" class="space-y-6"></div>

        <div id="status-container" class="hidden bg-slate-900 text-white p-4 rounded-xl shadow-md text-center space-y-2 border border-slate-700">
          <p id="status-texto" class="text-sm font-medium">Iniciando processamento...</p>
          <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div id="status-barra" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700 flex justify-end gap-4">
          <button type="button" id="btn-cancelar" class="px-6 py-2.5 border border-slate-600 rounded-lg font-semibold text-slate-300 hover:bg-slate-700 transition">
            Cancelar
          </button>
          <button type="submit" id="btn-salvar" class="px-8 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition shadow-sm flex items-center gap-2">
            <span>💾 Salvar Prova no Firebase</span>
          </button>
        </div>
      </form>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
      databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
      projectId: "cronometro-rally"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let totalFotosGlobal = 0;
    let nomeProvaGlobal = "";

    document.getElementById('form-step-1').addEventListener('submit', (e) => {
      e.preventDefault();
      nomeProvaGlobal = document.getElementById('nome-prova').value;
      totalFotosGlobal = parseInt(document.getElementById('qtd-fotos').value);

      if (!nomeProvaGlobal || !totalFotosGlobal || totalFotosGlobal <= 0) return;

      document.getElementById('display-nome-prova').textContent = `${nomeProvaGlobal} (${totalFotosGlobal} ${totalFotosGlobal === 1 ? 'Foto' : 'Fotos'})`;
      gerarCamposDeFotos(totalFotosGlobal);

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('btn-voltar').addEventListener('click', voltarPasso1);
    document.getElementById('btn-cancelar').addEventListener('click', voltarPasso1);

    function voltarPasso1() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    }

    function gerarCamposDeFotos(qtd) {
      const container = document.getElementById('container-fotos');
      container.innerHTML = '';

      for (let i = 1; i <= qtd; i++) {
        const fotoCard = document.createElement('div');
        fotoCard.className = "bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700 space-y-4";
        
        fotoCard.innerHTML = `
          <div class="flex items-center justify-between pb-3 border-b border-slate-700">
            <h3 class="font-bold text-slate-200 text-lg flex items-center gap-2">
              <span class="bg-indigo-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">${i}</span>
              Foto / Tarefa #${i}
            </h3>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-3">
              <label class="block text-sm font-semibold text-slate-300">Foto Gabarito (Referência)</label>
              <input type="file" id="foto_file_${i}" required accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-700 file:text-indigo-300 hover:file:bg-slate-600 cursor-pointer border border-slate-700 rounded-lg p-1">
              
              <div id="preview-box-${i}" class="hidden mt-2">
                <p class="text-xs text-slate-400 mb-1">Pré-visualização:</p>
                <img id="preview-img-${i}" src="" class="h-44 w-full object-cover rounded-lg border border-slate-700">
              </div>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Pontuação / Valor da Tarefa (Pontos)</label>
                <input type="number" id="pontos_${i}" value="100" min="1" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
              <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Quantidade de Competidores na Foto</label>
                <select id="num_competidores_${i}" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="1">0 Competidores</option>
                  <option value="2">1 Competidor</option>
                  <option value="3">2 Competidores</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Presença do Carro do Competidor</label>
                <select id="exigir_carro_${i}" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                  <option value="false">NÃO exigir o carro na foto</option>
                  <option value="true">EXIGIR que o carro esteja na foto (Pegadinha)</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Outras Pegadinhas / Instruções (Opcional)</label>
                <input type="text" id="pegadinhas_${i}" placeholder="Ex: Estátua visível no lado esquerdo" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
            </div>
          </div>
        `;

        container.appendChild(fotoCard);

        const inputImg = document.getElementById(`foto_file_${i}`);
        inputImg.addEventListener('change', (e) => {
          const file = e.target.files[0];
          const previewBox = document.getElementById(`preview-box-${i}`);
          const previewImg = document.getElementById(`preview-img-${i}`);
          if (file) {
            previewImg.src = URL.createObjectURL(file);
            previewBox.classList.remove('hidden');
          }
        });
      }
    }

    function otimizarImagemBase64(file, maxWidth = 1024, maxQuality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', maxQuality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('form-step-2').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSalvar = document.getElementById('btn-salvar');
      const statusContainer = document.getElementById('status-container');
      const statusTexto = document.getElementById('status-texto');
      const statusBarra = document.getElementById('status-barra');

      btnSalvar.disabled = true;
      btnSalvar.classList.add('opacity-50', 'cursor-not-allowed');
      statusContainer.classList.remove('hidden');

      try {
        const tarefasArr = [];

        for (let i = 1; i <= totalFotosGlobal; i++) {
          statusTexto.textContent = `Otimizando imagem ${i} de ${totalFotosGlobal}...`;
          statusBarra.style.width = `${Math.round(((i - 1) / totalFotosGlobal) * 80)}%`;

          const fileInput = document.getElementById(`foto_file_${i}`);
          const file = fileInput.files[0];
          const fotoBase64 = await otimizarImagemBase64(file);

          const pontos = parseInt(document.getElementById(`pontos_${i}`).value) || 100;
          const numCompetidores = parseInt(document.getElementById(`num_competidores_${i}`).value);
          const exigirCarro = document.getElementById(`exigir_carro_${i}`).value === 'true';
          const pegadinhas = document.getElementById(`pegadinhas_${i}`).value;

          tarefasArr.push({
            ordem: i,
            foto_gabarito_url: fotoBase64,
            pontos: pontos,
            qtd_competidores: numCompetidores,
            exigir_carro: exigirCarro,
            pegadinhas: pegadinhas || "",
            status: "ativo"
          });
        }

        statusTexto.textContent = "Salvando dados da prova no Realtime Database...";
        statusBarra.style.width = "90%";

        // Salva na mesma árvore do Realtime Database
        const novaProvaRef = db.ref('provas').push();
        await novaProvaRef.set({
          nome_prova: nomeProvaGlobal,
          qtd_tarefas: totalFotosGlobal,
          tarefas: tarefasArr,
          criado_em: firebase.database.ServerValue.TIMESTAMP
        });

        statusBarra.style.width = "100%";
        statusTexto.textContent = "✅ Prova salva com sucesso!";

        setTimeout(() => {
          alert("Prova e gabarito de fotos cadastrados com sucesso!");
          location.reload();
        }, 1200);

      } catch (error) {
        console.error("Erro ao salvar no Firebase:", error);
        alert("Erro ao salvar no Firebase: " + error.message);
        btnSalvar.disabled = false;
        btnSalvar.classList.remove('opacity-50', 'cursor-not-allowed');
        statusContainer.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
