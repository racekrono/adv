<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Race Krono</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0af0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Race Krono">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0d0d0f; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden; 
        }

        .card { 
            position: relative; 
            background: #0d0d0f; 
            padding: 12px 16px; 
            width: 100%; 
            max-width: 430px; 
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Banner Superior / Fundo de Rally */
        .hero-banner {
            position: relative;
            width: calc(100% + 32px);
            height: 130px; 
            background: url('https://raw.githubusercontent.com/racekrono/adv/refs/heads/main/navara2.jpg') no-repeat center top;
            background-size: cover;
            border-radius: 0 0 16px 16px;
            margin: -12px -16px 10px -16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px 16px;
            box-sizing: border-box;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(13,13,15,0.2) 0%, rgba(13,13,15,0.85) 75%, #0d0d0f 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .brand-sub {
            color: #ff2a2a;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .main-title {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.05;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Labels e Form */
        .input-label {
            color: #8a8a93;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 8px;
            margin-bottom: 4px;
            display: block;
        }

        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 12px; 
            border: 1px solid #27272a; 
            background: #18181b; 
            color: white; 
            font-size: 0.95rem; 
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ff1e1e;
            background: #202023;
        }

        /* Seletor de Categoria em Pills/Chips */
        .categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .cat-chip {
            background: #18181b;
            border: 1px solid #27272a;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cat-chip.active {
            background: #ff0000;
            border-color: #ff0000;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.35);
        }

        /* Botão de Iniciar Prova */
        .btn-action { 
            background: #ff0000; 
            border: none; 
            color: white;
            font-weight: 800; 
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer; 
            transition: transform 0.1s, background 0.2s; 
            width: 100%;
            margin-top: auto;
            margin-bottom: 12px;
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .btn-action:active { 
            transform: scale(0.98); 
            background: #cc0000;
        }

        #setup { display: flex; flex-direction: column; flex-grow: 1; }
        #ativo { display: none; flex-direction: column; overflow: hidden; flex-grow: 1; gap: 12px; }

        /* Modernização do Topo Ativo */
        .header-dados { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 4px 0 8px 0;
        }

        .header-carro-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .carro-info-group {
            display: flex;
            flex-direction: column;
        }

        .carro-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #71717a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        #viewCarro { 
            color: #ffffff; 
            margin: 0; 
            font-size: 1.6rem; 
            font-weight: 900; 
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .vel-box {
            text-align: right;
        }

        #viewVel { 
            font-size: 3.2rem; 
            font-weight: 900; 
            line-height: 0.9; 
            color: #facc15; 
            letter-spacing: -1px;
        }

        .unidade-kmh { 
            color: #71717a; 
            font-size: 0.65rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            display: block;
            margin-top: 2px;
        }

        /* Cartão do Odômetro */
        .odo-box { 
            padding: 16px; 
            background: #18181b; 
            border: 1px solid #27272a;
            border-radius: 16px; 
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .odo-label { 
            font-size: 0.7rem; 
            color: #a1a1aa; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .odo-val-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            margin: 4px 0 12px 0;
        }

        .odo-val { 
            font-size: 4rem; 
            text-align: center; 
            font-weight: 900; 
            color: #facc15; 
            margin: 0; 
            cursor: pointer; 
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 0.95; 
            letter-spacing: -1px;
        }

        .odo-unit {
            font-size: 1.1rem;
            font-weight: 800;
            color: #a1a1aa;
        }

        .odo-hint {
            font-size: 0.7rem;
            color: #52525b;
            margin-top: 8px;
            font-weight: 600;
        }

        .odo-btns { 
            display: flex; 
            gap: 6px; 
            justify-content: center; 
            margin-top: 6px; 
        }

        .btn-mini { 
            padding: 12px 0; 
            font-size: 0.85rem; 
            font-weight: 800;
            background: #27272a; 
            margin-bottom: 0; 
            width: auto; 
            flex: 1; 
            border: 1px solid #3f3f46; 
            color: #ffffff; 
            border-radius: 10px; 
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }

        .btn-mini:active {
            transform: scale(0.96);
            background: #3f3f46;
        }

        .btn-zerar {
            background: #dc2626 !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
        }

        .btn-zerar:active {
            background: #b91c1c !important;
        }

        /* Título da Seção Roadbook */
        .roadbook-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .roadbook-header svg {
            width: 16px;
            height: 16px;
            fill: #facc15;
        }

        /* Container & Cards da Planilha Digital */
        .roadbook-container {
            background: #000;
            border-radius: 8px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-grow: 1;
            border: 2px solid #333;
            min-height: 220px;
            max-height: 260px;
            margin-bottom: 10px;
            scroll-behavior: smooth;
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        .roadbook-item { 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #222; 
            padding: 6px 4px; 
            gap: 8px; 
            transition: background 0.3s; 
            cursor: pointer; 
            box-sizing: border-box; 
            width: 100%;
            overflow: hidden;
        }

        .rb-item-ativo { 
            background-color: #262d37 !important; 
            border-left: 6px solid #FF0000; 
        }

        .rb-col-km { 
            flex: 0 0 55px; 
            font-family: monospace; 
            font-weight: bold; 
            color: #f1c40f; 
            font-size: 16px; 
            text-align: right; 
        }

        .rb-col-tulipa { 
            flex: 0 0 70px; 
            background: white; 
            padding: 2px; 
            border-radius: 4px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 60px; 
            overflow: hidden;
        }

        .rb-col-tulipa img { 
            max-width: 100%; 
            height: auto; 
            max-height: 60px; 
            object-fit: contain;
        }

        .rb-col-obs { 
            flex: 1; 
            font-size: 12px; 
            color: #eee; 
            text-align: left; 
            text-transform: uppercase; 
            font-weight: bold; 
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        /* Status Live */
        .status-container { 
            padding: 10px 14px; 
            border-radius: 12px; 
            background: #18181b; 
            border: 1px solid #27272a; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-gps { 
            color: #38bdf8; 
            font-weight: 800; 
            font-size: 0.75rem; 
            text-align: center; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-gps::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse-live 1.8s infinite;
        }

        @keyframes pulse-live {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status-offline { 
            color: #facc15 !important; 
        }

        .status-offline::before {
            background-color: #facc15 !important;
            box-shadow: 0 0 8px #facc15 !important;
            animation: none !important;
        }

        /* Menu de Opções Modernizado */
        #menuContainer { 
            position: relative;
        }

        #btnMenu { 
            width: 42px; 
            height: 42px; 
            padding: 0; 
            margin: 0; 
            border-radius: 12px; 
            background: #18181b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 1px solid #27272a; 
            font-size: 18px; 
            color: white; 
            cursor: pointer;
            transition: background 0.2s;
        }

        #btnMenu:active {
            background: #27272a;
        }

        #menuOpcoes { 
            display: none; 
            position: absolute; 
            top: 48px; 
            left: 0; 
            background: #18181b; 
            border: 1px solid #27272a; 
            border-radius: 12px; 
            width: 220px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); 
            overflow: hidden; 
            z-index: 100;
        }

        #menuOpcoes button { 
            margin: 0; 
            border: none; 
            border-bottom: 1px solid #27272a; 
            background: transparent; 
            text-align: left; 
            font-size: 0.85rem; 
            font-weight: 700;
            padding: 14px 16px; 
            border-radius: 0; 
            color: white; 
            width: 100%; 
            cursor: pointer; 
            transition: background 0.15s;
        }

        #menuOpcoes button:last-child { border-bottom: none; }
        #menuOpcoes button:hover { background: #27272a; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="setup">
            <div class="hero-banner">
                <div class="hero-content">
                    <div class="brand-sub">RACE KRONO</div>
                    <h1 class="main-title">RALLY DE<br>AVENTURA</h1>
                </div>
            </div>

            <label class="input-label">PILOTO / NAVEGADOR</label>
            <input type="text" id="nome" placeholder="Ex.: João da Silva / Marcos Araújo" oninput="this.value = this.value.replace(/[0-9]/g, '')">

            <label class="input-label">Nº DO CARRO</label>
            <input type="number" id="carro" placeholder="Ex.: 42" min="1" max="100">

            <label class="input-label">CATEGORIA</label>
            <div class="categories-grid" id="categoriaSelector">
                <div class="cat-chip active" data-value="UTV">UTV</div>
                <div class="cat-chip" data-value="BAIANO 4x2">BAIANO 4x2</div>
                <div class="cat-chip" data-value="BAIANO 4x4">BAIANO 4x4</div>
                <div class="cat-chip" data-value="INICIANTE 4x2">INICIANTE 4x2</div>
                <div class="cat-chip" data-value="INICIANTE 4x4">INICIANTE 4x4</div>
                <div class="cat-chip" data-value="ANTIGOS">ANTIGOS</div>
            </div>
            <input type="hidden" id="categoria" value="UTV">

            <button id="btnIniciar" class="btn-action">INICIAR PROVA</button>
        </div>

        <div id="ativo">
            <div class="header-dados">
                <div class="header-carro-box">
                    <div id="menuContainer">
                        <button id="btnMenu">☰</button>
                        <div id="menuOpcoes">
                            <button onclick="enviarDatalogger()">📤 Enviar Datalogger</button>
                            <button onclick="encerrarSessao()">❌➡️ SAIR (senha: 123456)</button>
                        </div>
                    </div>
                    <div class="carro-info-group">
                        <span class="carro-label">CARRO</span>
                        <span id="viewCarro">---</span>
                    </div>
                </div>

                <div class="vel-box">
                    <div id="viewVel">0</div>
                    <span class="unidade-kmh">KM/H</span>
                </div>
            </div>

            <div class="odo-box">
                <span class="odo-label">ODÔMETRO</span>
                <div class="odo-val-container" onclick="ajusteManualOdo()">
                    <div id="displayOdo" class="odo-val">0,000</div>
                    <span class="odo-unit">km</span>
                </div>
                <div class="odo-btns">
                    <button class="btn-mini" onclick="alterarOdo(-0.010)">-10m</button>
                    <button class="btn-mini" onclick="alterarOdo(-0.001)">-1m</button>
                    <button class="btn-mini btn-zerar" onclick="zerarOdo()">ZERAR</button>
                    <button class="btn-mini" onclick="alterarOdo(0.001)">+1m</button>
                    <button class="btn-mini" onclick="alterarOdo(0.010)">+10m</button>
                </div>
                <div class="odo-hint">Toque e segure no valor para ajuste manual</div>
            </div>

            <div class="roadbook-header">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                ROADBOOK
            </div>

            <div class="roadbook-container" id="roadbookList">
                <div style="padding: 20px; color: #71717a; font-size: 11px; text-align: center; font-weight: bold;">CARREGANDO PLANILHA...</div>
            </div>

            <div class="status-container">
                <div id="msgGps" class="status-gps">TRANSMITINDO AO VIVO</div>
            </div>
        </div>
    </div>

    <script>
        // Lógica de Seleção de Categoria via Chips
        const categoryChips = document.querySelectorAll('.cat-chip');
        const hiddenCategoryInput = document.getElementById('categoria');

        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                hiddenCategoryInput.value = chip.getAttribute('data-value');
            });
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);

        window.__rk = window.__rk || {};
        window.__rk.firebase = firebase;
        window.__rk.db = db;

        let wakeLock = null;
        let watchID = null;
        let odoTotal = 0;      
        let tripOffset = 0;    
        let ultimaPos = null;
        let indiceTulipaAtual = 0; 
        let dadosRoadbookAtual = []; 

        let audioCtx = null;

        function obterAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function tocarBip(frequencia, duracao, volume = 0.1) {
            try {
                const ctx = obterAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequencia, ctx.currentTime);
                gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duracao);
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + duracao);
                oscillator.onended = () => {
                    oscillator.disconnect();
                    gainNode.disconnect();
                };
            } catch (e) { console.error(e); }
        }

        const somClique = () => tocarBip(2000, 0.08, 0.1);
        const somTrocaReferencia = () => tocarBip(1200, 0.25, 0.15);

        const btnMenu = document.getElementById('btnMenu');
        const menuOpcoes = document.getElementById('menuOpcoes');

        btnMenu.onclick = (e) => {
            e.stopPropagation();
            menuOpcoes.style.display = menuOpcoes.style.display === 'block' ? 'none' : 'block';
        };

        window.onclick = () => {
            menuOpcoes.style.display = 'none';
        };

        async function enviarDatalogger() {
            menuOpcoes.style.display = 'none';
            
            if (window.__rk && window.__rk.enviarDataloggerNativo) {
                window.__rk.enviarDataloggerNativo();
                return;
            }

            const numCarro = window.__rk.carroAtivo || localStorage.getItem('rally_carro_ativo');
            if (!numCarro) {
                alert("Nenhum carro ativo identificado para enviar o datalogger.");
                return;
            }

            try {
                const dataloggerLocal = localStorage.getItem('rally_datalogger_' + numCarro);
                if (!dataloggerLocal) {
                    alert("Nenhum dado pendente no Datalogger.");
                    return;
                }

                const pontos = JSON.parse(dataloggerLocal);
                await db.ref('datalogger/' + numCarro).push({
                    dataEnvio: Date.now(),
                    pontos: pontos
                });

                localStorage.removeItem('rally_datalogger_' + numCarro);
                alert("Datalogger enviado com sucesso!");
            } catch (erro) {
                console.error("Erro ao enviar datalogger:", erro);
                alert("Falha ao enviar datalogger. Verifique sua conexão.");
            }
        }

        db.ref('configuracoes/comandoLogoff').on('value', (snap) => {
            const timestampLogoff = snap.val();
            const tempoLogin = localStorage.getItem('rally_timestamp_login') || 0;
            if (timestampLogoff && timestampLogoff > parseInt(tempoLogin) && localStorage.getItem('rally_carro_ativo')) {
                encerrarSessaoRemoto();
            }
        });

        function carregarRoadbook() {
            const rbList = document.getElementById('roadbookList');

            try {
                const planilhaSalva = localStorage.getItem('rally_planilha_cache');
                if (planilhaSalva) {
                    const dadosLocais = JSON.parse(planilhaSalva);
                    if (dadosLocais && dadosLocais.length) {
                        renderizarRoadbook(dadosLocais);
                    }
                }
            } catch (e) { console.error(e); }

            db.ref('prova_atual').on('value', (snapshot) => {
                const dados = snapshot.val();
                if (!dados) return;
                renderizarRoadbook(dados);
                try {
                    localStorage.setItem('rally_planilha_cache', JSON.stringify(dados));
                } catch (e) {}
            });
        }

        function renderizarRoadbook(dados) {
            dadosRoadbookAtual = dados;
            const rbList = document.getElementById('roadbookList');
            rbList.innerHTML = '';
            dados.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'roadbook-item';
                div.id = 'rb-item-' + index;
                div.onclick = () => selecionarTulipaManualmente(index);
                
                const imgUrl = item.tulipa || '';
                const obs = item.obs || '--';
                const kmFormatted = parseFloat(item.km).toFixed(3).replace('.', ',');
                
                div.innerHTML = `
                    <div class="rb-col-km-group">
                        <span class="rb-col-km">${kmFormatted}</span>
                        <span class="rb-col-km-unit">km</span>
                    </div>
                    <div class="rb-col-tulipa">
                        ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="rb-col-obs">${obs}</div>
                `;
                rbList.appendChild(div);
            });
            destacarTulipa(indiceTulipaAtual, false);
        }

        function selecionarTulipaManualmente(index) {
            indiceTulipaAtual = index;
            destacarTulipa(index, true);

            if (dadosRoadbookAtual && dadosRoadbookAtual[index]) {
                const kmTulipa = parseFloat(dadosRoadbookAtual[index].km);
                if (!isNaN(kmTulipa)) {
                    tripOffset = odoTotal - kmTulipa;
                    atualizarTelaOdo();
                }
            }
        }

        function atualizarScrollRoadbook() {
            if (!dadosRoadbookAtual || dadosRoadbookAtual.length === 0) return;

            const odoExibicao = Math.max(0, odoTotal - tripOffset);

            if (indiceTulipaAtual + 1 < dadosRoadbookAtual.length) {
                const proximoKm = parseFloat(dadosRoadbookAtual[indiceTulipaAtual + 1].km);
                
                if (odoExibicao >= (proximoKm - 0.0005)) {
                    indiceTulipaAtual++;
                    destacarTulipa(indiceTulipaAtual, true);
                }
            }
        }

        function destacarTulipa(index, tocarSom) {
            const todosItens = document.querySelectorAll('.roadbook-item');
            todosItens.forEach(el => el.classList.remove('rb-item-ativo'));

            const itemAlvo = document.getElementById('rb-item-' + index);
            if (itemAlvo) {
                itemAlvo.classList.add('rb-item-ativo');
                if (tocarSom) somTrocaReferencia();
                
                itemAlvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function liberarWakeLock() {
            if (wakeLock) {
                wakeLock.release().then(() => { wakeLock = null; }).catch(() => {});
            }
        }

        function processarPontoGps(num, lat, lng, accuracy, kmh) {
            if (accuracy > 25) return;

            if (ultimaPos) {
                const dist = calcularDistancia(ultimaPos.lat, ultimaPos.lng, lat, lng);
                if (dist > 0.004) {
                    odoTotal += dist;
                    atualizarTelaOdo();
                    ultimaPos = { lat, lng };
                }
            } else {
                ultimaPos = { lat, lng };
            }

            document.getElementById('viewVel').innerText = Math.round(kmh);
            const dados = { lat, lng, vel: kmh, acc: accuracy, ts: Date.now() };

            if (window.__rk && window.__rk.registrarPontoGps) {
                window.__rk.registrarPontoGps(num, dados);
            } else {
                db.ref('posicoes/' + num).set(dados);
                db.ref('rastros/' + num).push(dados);
            }
        }

        window.__rk.processarPontoGps = processarPontoGps;

        function iniciarFluxoRastreio(num) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('ativo').style.display = 'flex';
            document.getElementById('viewCarro').innerText = num;
            window.__rk.carroAtivo = num;
            solicitarWakeLock();

            db.ref(".info/connected").on("value", (snap) => {
                const msg = document.getElementById('msgGps');
                if (snap.val() === true) {
                    msg.innerText = "TRANSMITINDO AO VIVO";
                    msg.classList.remove('status-offline');
                } else {
                    msg.innerText = "SEM INTERNET - DADOS PROTEGIDOS";
                    msg.classList.add('status-offline');
                }
            });

            if (window.__rk && window.__rk.iniciarGpsNativo) {
                window.__rk.iniciarGpsNativo(num);
            } else {
                watchID = navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const speedMS = position.coords.speed || 0;
                    const kmh = Math.round(speedMS * 3.6);
                    processarPontoGps(num, lat, lng, accuracy, kmh);
                }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            }
        }
        window.__rk.iniciarFluxoRastreio = iniciarFluxoRastreio;
        window.__rk.carregarRoadbook = carregarRoadbook;

        document.getElementById('btnIniciar').onclick = async function() {
            const numRaw = document.getElementById('carro').value;
            const nomeRaw = document.getElementById('nome').value.trim();
            const cat = document.getElementById('categoria').value;
            const num = parseInt(numRaw);
            if(!nomeRaw || !numRaw) return alert("Preencha todos os campos!");
            try {
                const statusSnap = await db.ref('configuracoes/provaAberta').once('value');
                if (statusSnap.val() !== true) return alert("🚫 A prova está fechada.");

                somClique();
                await db.ref('competidores/' + num).set({ nome: nomeRaw, categoria: cat });
                localStorage.setItem('rally_carro_ativo', num);
                localStorage.setItem('rally_timestamp_login', Date.now());

                iniciarFluxoRastreio(num);
                carregarRoadbook();
            } catch (e) { alert("Erro de conexão."); }
        };

        function alterarOdo(v) {
            odoTotal = Math.max(0, odoTotal + v);
            somClique();
            atualizarTelaOdo();
        }

        function zerarOdo() {
            if(confirm("Zerar odômetro?")) {
                const odoExibicao = Math.max(0, odoTotal - tripOffset);
                tripOffset = odoTotal;
                somClique();
                
                if (dadosRoadbookAtual && dadosRoadbookAtual.length) {
                    if (odoExibicao >= 5.0) {
                        for (let i = indiceTulipaAtual + 1; i < dadosRoadbookAtual.length; i++) {
                            const km = parseFloat(dadosRoadbookAtual[i].km);
                            if (km === 0 || dadosRoadbookAtual[i].zerar === true) {
                                indiceTulipaAtual = i;
                                destacarTulipa(indiceTulipaAtual, true);
                                break;
                            }
                        }
                    } else {
                        for (let i = indiceTulipaAtual; i >= 0; i--) {
                            const km = parseFloat(dadosRoadbookAtual[i].km);
                            if (km === 0 || dadosRoadbookAtual[i].zerar === true) {
                                indiceTulipaAtual = i;
                                destacarTulipa(indiceTulipaAtual, true);
                                break;
                            }
                        }
                    }
                }
                
                atualizarTelaOdo();
            }
        }

        function atualizarTelaOdo() {
            const odoExibicao = Math.max(0, odoTotal - tripOffset);
            document.getElementById('displayOdo').innerText = odoExibicao.toFixed(3).replace('.', ',');
            atualizarScrollRoadbook();
        }

        function ajusteManualOdo() {
            const odoExibicao = Math.max(0, odoTotal - tripOffset);
            let n = prompt("Ajustar Odômetro (KM):", odoExibicao.toFixed(3));
            if (n !== null) {
                let val = parseFloat(n.replace(',', '.'));
                if (!isNaN(val)) {
                    tripOffset = odoTotal - Math.max(0, val);
                    somClique();

                    if (dadosRoadbookAtual && dadosRoadbookAtual.length) {
                        let inicioBloco = 0;
                        for (let i = indiceTulipaAtual; i >= 0; i--) {
                            const kmTulipa = parseFloat(dadosRoadbookAtual[i].km);
                            if (kmTulipa === 0 || dadosRoadbookAtual[i].zerar === true) {
                                inicioBloco = i;
                                break;
                            }
                        }

                        let fimBloco = dadosRoadbookAtual.length;
                        for (let i = inicioBloco + 1; i < dadosRoadbookAtual.length; i++) {
                            const kmTulipa = parseFloat(dadosRoadbookAtual[i].km);
                            if (kmTulipa === 0 || dadosRoadbookAtual[i].zerar === true) {
                                fimBloco = i;
                                break;
                            }
                        }

                        let novoIndice = inicioBloco;
                        for (let i = inicioBloco; i < fimBloco; i++) {
                            const kmTulipa = parseFloat(dadosRoadbookAtual[i].km);
                            if (val >= kmTulipa) {
                                novoIndice = i;
                            } else {
                                break;
                            }
                        }

                        indiceTulipaAtual = novoIndice;
                        destacarTulipa(indiceTulipaAtual, true);
                    }

                    atualizarTelaOdo();
                }
            }
        }

        function encerrarSessao() {
            menuOpcoes.style.display = 'none';
            const senha = prompt("Informe a senha para sair da prova:");
            if (senha === "123456") {
                pararGps();
                liberarWakeLock();
                limparTudo();
                location.reload();
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        }

        function encerrarSessaoRemoto() {
            pararGps();
            liberarWakeLock();
            limparTudo();
            alert("A organização encerrou a sessão.");
            location.reload();
        }

        function pararGps() {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            if (window.__rk && window.__rk.pararGpsNativo) window.__rk.pararGpsNativo();
        }

        async function limparTudo() {
            localStorage.removeItem('rally_carro_ativo');
            localStorage.removeItem('rally_timestamp_login');
        }

        (function restaurarSessaoWeb() {
          function tentar() {
            if (document.getElementById('ativo').style.display === 'flex') return;
            const carro = localStorage.getItem('rally_carro_ativo');
            if (!carro) return;
            const num = parseInt(carro);
            if (!num) return;
            try {
              iniciarFluxoRastreio(num);
              carregarRoadbook();
            } catch (e) {}
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tentar);
          } else {
            tentar();
          }
        })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker registrado com sucesso:', reg.scope))
            .catch((err) => console.error('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
