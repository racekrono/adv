<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadbook Digital - Rally</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-yellow: #ffcc00;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Painel do Hodômetro / Painel Principal */
    .dashboard {
      background-color: var(--card-bg);
      padding: 15px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .display-box {
      text-align: center;
    }

    .display-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: bold;
    }

    .display-value {
      font-size: 2rem;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent-yellow);
    }

    .btn-zerar {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .btn-zerar:active {
      transform: scale(0.98);
      background-color: #e6b800;
    }

    /* Modulo do Roadbook (Planilha Solta / Scrollable) */
    .roadbook-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .tulipa-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 15px;
      display: grid;
      grid-template-columns: 80px 100px 1fr;
      align-items: center;
      gap: 15px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    /* Destaque para a tulipa ativa no momento */
    .tulipa-card.active {
      border: 2px solid var(--accent-yellow);
      background-color: #2a2a1a;
    }

    .tulipa-km {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-yellow);
    }

    .tulipa-id {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .tulipa-desc {
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- PAINEL SUPERIOR -->
  <div class="dashboard">
    <div class="display-box">
      <div class="display-label">Total (KM)</div>
      <div class="display-value" id="totalKmDisplay">0.00</div>
    </div>

    <div class="display-box">
      <div class="display-label">Trip Parcial (KM)</div>
      <div class="display-value" id="tripKmDisplay">0.00</div>
    </div>

    <button class="btn-zerar" onclick="zerarTrip()">Zerar Trip</button>
  </div>

  <!-- ROADBOOK / PLANILHA -->
  <div class="roadbook-container" id="roadbookContainer">
    <!-- As tulipas serão renderizadas via JavaScript -->
  </div>

  <script>
    // 1. DADOS DE EXEMPLO DO ROADBOOK (Planilha)
    const planilha = [
      { id: 1, kmTotal: 0.00, desc: "Largada - Seguir em frente na via principal" },
      { id: 2, kmTotal: 0.85, desc: "Virar à direita no mata-burro" },
      { id: 3, kmTotal: 1.40, desc: "Manter à esquerda na bifurcação" },
      { id: 4, kmTotal: 2.10, desc: "Lombada alta - Atenção!" },
      { id: 5, kmTotal: 3.55, desc: "Entrar à esquerda na estrada de terra" },
      { id: 6, kmTotal: 4.80, desc: "Ponte estreita - Reduzir" },
      { id: 7, kmTotal: 6.20, desc: "Chegada / Ponto de Controle (PC)" }
    ];

    // 2. VARIÁVEIS DE ESTADO
    let totalKmAcumulado = 0.00; // Distância REAL vinda do GPS/Sensor
    let tripOffset = 0.00;        // Ponto de referência onde o Trip foi zerado
    let currentTulipaIndex = 0;   // Índice da tulipa selecionada/visível

    // 3. INICIALIZAÇÃO
    function init() {
      renderRoadbook();
      atualizarDisplays();
      
      // Simulação: Incrementa a distância a cada 2 segundos para testar o movimento
      setInterval(() => {
        totalKmAcumulado += 0.10; // Avança 100 metros
        checarProgressoRoadbook();
        atualizarDisplays();
      }, 2000);
    }

    // 4. RENDERIZA A PLANILHA NA TELA
    function renderRoadbook() {
      const container = document.getElementById('roadbookContainer');
      container.innerHTML = '';

      planilha.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `tulipa-card ${index === currentTulipaIndex ? 'active' : ''}`;
        card.id = `tulipa-${index}`;

        card.innerHTML = `
          <div>
            <div class="tulipa-id">#${item.id}</div>
            <div class="tulipa-km">${item.kmTotal.toFixed(2)}</div>
          </div>
          <div style="font-weight: bold; color: #888;">[ TULIPA ]</div>
          <div class="tulipa-desc">${item.desc}</div>
        `;

        container.appendChild(card);
      });
    }

    // 5. ATUALIZA OS DISPLAYS DO PAINEL
    function atualizarDisplays() {
      // O Trip Parcial é o Total percorrido MINUS a marcação onde ele foi zerado
      const tripParcial = totalKmAcumulado - tripOffset;

      document.getElementById('totalKmDisplay').innerText = totalKmAcumulado.toFixed(2);
      document.getElementById('tripKmDisplay').innerText = tripParcial.toFixed(2);
    }

    // 6. LÓGICA CORRIGIDA DO BOTÃO ZERAR
    function zerarTrip() {
      // ✅ Atualiza apenas o Offset do Trip com o valor do Hodômetro Total
      tripOffset = totalKmAcumulado;

      // ✅ Atualiza a tela imediatamente
      atualizarDisplays();

      // 🛑 IMPORTANTE: NÃO alteramos 'currentTulipaIndex' e nem resetamos o 'scrollTop'!
      // O Roadbook permanece focado e posicionado na mesma linha.
    }

    // 7. AVANÇA A PLANILHA COM BASE NO HODÔMETRO TOTAL (Não pelo Trip)
    function checarProgressoRoadbook() {
      // A planilha deve rodar usando o kmTotal real do percurso!
      for (let i = planilha.length - 1; i >= 0; i--) {
        if (totalKmAcumulado >= planilha[i].kmTotal) {
          if (currentTulipaIndex !== i) {
            currentTulipaIndex = i;
            destacarEAncorarTulipa(i);
          }
          break;
        }
      }
    }

    // 8. DESTACA E ROLA A TELA ATÉ A TULIPA ATUAL
    function destacarEAncorarTulipa(index) {
      // Remove classe 'active' de todos
      document.querySelectorAll('.tulipa-card').forEach(el => el.classList.remove('active'));

      // Adiciona na atual
      const cardAtivo = document.getElementById(`tulipa-${index}`);
      if (cardAtivo) {
        cardAtivo.classList.add('active');
        
        // Rola a tela até o item mantendo o contexto (Scroll suave)
        cardAtivo.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Executa na inicialização
    window.onload = init;
  </script>
</body>
</html>
