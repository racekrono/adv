<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Gabarito de Fotos - Rally</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Cadastro de Provas e Gabarito de Fotos</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Nome da Prova / Rally:</label>
            <input type="text" id="nomeProva" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ex: Rally Indoor 2026">
        </div>

        <div class="border-t pt-4 mt-4">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Adicionar Ponto do Gabarito</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Número do Posto / ID:</label>
                    <input type="text" id="postoId" class="w-full border rounded px-3 py-2" placeholder="Ex: PC-01">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Descrição / Referência:</label>
                    <input type="text" id="postoDesc" class="w-full border rounded px-3 py-2" placeholder="Ex: Placa km 10">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-1">Valor / Pontuação:</label>
                    <input type="number" id="postoPontos" class="w-full border rounded px-3 py-2" value="10">
                </div>
            </div>
            <button id="btnAdicionarPonto" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-semibold">Adicionar Ponto ao Gabarito</button>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Pontos Cadastrados na Prova:</h2>
            <ul id="listaGabarito" class="border rounded divide-y bg-gray-50 p-2 min-h-[100px]">
                <li class="text-gray-500 text-sm">Nenhum ponto adicionado ainda.</li>
            </ul>
        </div>

        <div class="mt-6 flex justify-end">
            <button id="btnSalvarProva" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-bold">Salvar Prova no Banco</button>
        </div>
    </div>

    <!-- Firebase SDKs (Compat / Modular Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            storageBucket: "cronometro-rally.firebasestorage.app",
            messagingSenderId: "341731891354",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let pontosTemporarios = [];

        document.getElementById('btnAdicionarPonto').addEventListener('click', () => {
            const id = document.getElementById('postoId').value.trim();
            const descricao = document.getElementById('postoDesc').value.trim();
            const pontos = document.getElementById('postoPontos').value.trim();

            if (!id || !descricao) {
                alert('Preencha o ID e a descrição do posto.');
                return;
            }

            pontosTemporarios.push({ id, descricao, pontos: Number(pontos) });
            atualizarListaInterface();

            document.getElementById('postoId').value = '';
            document.getElementById('postoDesc').value = '';
            document.getElementById('postoId').focus();
        });

        function atualizarListaInterface() {
            const lista = document.getElementById('listaGabarito');
            if (pontosTemporarios.length === 0) {
                lista.innerHTML = '<li class="text-gray-500 text-sm">Nenhum ponto adicionado ainda.</li>';
                return;
            }
            lista.innerHTML = '';
            pontosTemporarios.forEach((p, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center py-2 px-2";
                li.innerHTML = `<span><strong>${p.id}</strong> - ${p.descricao} (${p.pontos} pts)</span>
                                <button onclick="removerPonto(${index})" class="text-red-500 hover:text-red-700 text-sm">Remover</button>`;
                lista.appendChild(li);
            });
        }

        window.removerPonto = function(index) {
            pontosTemporarios.splice(index, 1);
            atualizarListaInterface();
        };

        document.getElementById('btnSalvarProva').addEventListener('click', async () => {
            const nomeProva = document.getElementById('nomeProva').value.trim();
            if (!nomeProva) {
                alert('Informe o nome da prova.');
                return;
            }
            if (pontosTemporarios.length === 0) {
                alert('Adicione pelo menos um ponto ao gabarito.');
                return;
            }

            try {
                const novaProvaRef = push(ref(db, 'provas_fotos'));
                await set(novaProvaRef, {
                    nome: nomeProva,
                    gabarito: pontosTemporarios,
                    criadoEm: Date.now()
                });
                alert('Prova e gabarito salvos com sucesso!');
                pontosTemporarios = [];
                document.getElementById('nomeProva').value = '';
                atualizarListaInterface();
            } catch (error) {
                console.error("Erro ao salvar prova:", error);
                alert('Erro ao salvar no banco de dados.');
            }
        });
    </script>
</body>
</html>
