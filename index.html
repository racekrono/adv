<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Race Krono</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0af0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Race Krono">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0f0f11; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden; 
        }

        .card { 
            position: relative; 
            background: #0f0f11; 
            padding: 20px; 
            width: 100%; 
            max-width: 420px; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
        }

        /* Banner Superior / Fundo de Rally */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 220px;
            background: url('https://raw.githubusercontent.com/racekrono/adv/refs/heads/main/navara2.jpg') no-repeat center top;
            background-size: cover;
            border-radius: 0 0 16px 16px;
            margin: -20px -20px 20px -20px;
            width: calc(100% + 40px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(15,15,17,0.2) 0%, rgba(15,15,17,0.85) 75%, #0f0f11 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .brand-sub {
            color: #ff2a2a;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .main-title {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.05;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Labels e Form */
        .input-label {
            color: #8a8a93;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid #2a2a2e; 
            background: #1c1c1e; 
            color: white; 
            font-size: 1rem; 
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #ff1e1e;
            background: #242426;
        }

        /* Seletor de Categoria em Pills/Chips */
        .categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .cat-chip {
            background: #1c1c1e;
            border: 1px solid #2a2a2e;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cat-chip.active {
            background: #ff0000;
            border-color: #ff0000;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.35);
        }

        /* Botão de Iniciar Prova */
        .btn-action { 
            background: #ff0000; 
            border: none; 
            color: white;
            font-weight: 800; 
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 18px;
            border-radius: 12px;
            cursor: pointer; 
            transition: transform 0.1s, background 0.2s; 
            width: 100%;
            margin-top: auto;
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .btn-action:active { 
            transform: scale(0.98); 
            background: #cc0000;
        }

        #setup { display: flex; flex-direction: column; flex-grow: 1; }
        #ativo { display: none; flex-direction: column; overflow: hidden; flex-grow: 1; }

        /* Estilos da Tela de Prova Ativa */
        .header-dados { display: flex; justify-content: center; align-items: baseline; gap: 12px; margin-bottom: 5px; }
        #viewCarro { color: #ffffff; margin: 0; font-size: 1.1rem; font-weight: bold; }
        #viewVel { font-size: 3rem; font-weight: bold; line-height: 1; color: #f1c40f; }
        .unidade-kmh { color: #888; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        .odo-box { padding: 10px 5px; border-top: 1px solid #333; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 10px; }
        .odo-label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .odo-val { font-size: 4rem; text-align: center; font-weight: bold; color: #f1c40f; margin: 0; cursor: pointer; font-family: monospace; line-height: 1; }
        .odo-btns { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
        .btn-mini { padding: 8px 2px; font-size: 11px; background: #333; margin-bottom: 0; width: auto; flex: 1; border: 1px solid #444; color: white; border-radius: 4px; }

        .roadbook-container {
            background: #000;
            border-radius: 8px;
            overflow-y: auto;
            flex-grow: 1;
            border: 2px solid #333;
            min-height: 220px;
            max-height: 260px;
            margin-bottom: 10px;
            scroll-behavior: smooth;
            position: relative;
        }
        .roadbook-item { display: flex; align-items: center; border-bottom: 1px solid #222; padding: 6px 4px; gap: 8px; transition: background 0.3s; cursor: pointer; box-sizing: border-box; }
        .rb-item-ativo { background-color: #262d37 !important; border-left: 6px solid #FF0000 ; }
        .rb-col-km { flex: 0 0 55px; font-family: monospace; font-weight: bold; color: #f1c40f; font-size: 18px; text-align: right; }
        .rb-col-tulipa { flex: 0 0 80px; background: white; padding: 2px; border-radius: 4px; display: flex; justify-content: center; align-items: center; min-height: 70px; }
        .rb-col-tulipa img { max-width: 100%; height: auto; max-height: 70px; }
        .rb-col-obs { flex: 1; font-size: 14px; color: #eee; text-align: left; text-transform: uppercase; font-weight: bold; }

        .status-container { padding: 5px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid #333; margin-bottom: 5px; }
        .status-gps { color: #2ecc71; font-weight: bold; font-size: 11px; text-align: center; }
        .status-offline { color: #f1c40f !important; }

        #menuContainer { position: absolute; top: 15px; right: 15px; z-index: 100; }
        #btnMenu { width: 40px; height: 40px; padding: 0; margin: 0; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; border: 1px solid #444; font-size: 20px; color: white; backdrop-filter: blur(4px); }
        #menuOpcoes { display: none; position: absolute; top: 45px; right: 0; background: #252525; border: 1px solid #444; border-radius: 8px; width: 200px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); overflow: hidden; }
        #menuOpcoes button { margin: 0; border: none; border-bottom: 1px solid #333; background: transparent; text-align: left; font-size: 14px; padding: 15px; border-radius: 0; color: white; width: 100%; cursor: pointer; }
        #menuOpcoes button:last-child { border-bottom: none; }
        #menuOpcoes button:hover { background: #333; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="menuContainer">
            <button id="btnMenu">☰</button>
            <div id="menuOpcoes">
                <button onclick="enviarDatalogger()">📤 Enviar Datalogger</button>
                <button onclick="encerrarSessao()">❌➡️ SAIR (senha: 123456)</button>
            </div>
        </div>

        <div id="setup">
            <div class="hero-banner">
                <div class="hero-content">
                    <div class="brand-sub">RACE KRONO</div>
                    <h1 class="main-title">RALLY DE<br>AVENTURA</h1>
                </div>
            </div>

            <label class="input-label">NOME DO PILOTO</label>
            <input type="text" id="nome" placeholder="Ex.: João da Silva" oninput="this.value = this.value.replace(/[0-9]/g, '')">

            <label class="input-label">Nº DO CARRO</label>
            <input type="number" id="carro" placeholder="Ex.: 42" min="1" max="100">

            <label class="input-label">CATEGORIA</label>
            <div class="categories-grid" id="categoriaSelector">
                <div class="cat-chip active" data-value="UTV">UTV</div>
                <div class="cat-chip" data-value="BAIANO 4x2">BAIANO 4x2</div>
                <div class="cat-chip" data-value="BAIANO 4x4">BAIANO 4x4</div>
                <div class="cat-chip" data-value="INICIANTE 4x2">INICIANTE 4x2</div>
                <div class="cat-chip" data-value="INICIANTE 4x4">INICIANTE 4x4</div>
                <div class="cat-chip" data-value="ANTIGOS">ANTIGOS</div>
            </div>
            <input type="hidden" id="categoria" value="UTV">

            <button id="btnIniciar" class="btn-action">INICIAR PROVA</button>
        </div>

        <div id="ativo">
            <div class="header-dados">
                <span id="viewCarro">Carro --</span>
                <div id="viewVel">0.0</div>
                <span class="unidade-kmh">KM/H</span>
            </div>

            <div class="odo-box">
                <span class="odo-label">Odômetro</span>
                <div id="displayOdo" class="odo-val" onclick="ajusteManualOdo()">0.000</div>
                <div class="odo-btns">
                    <button class="btn-mini" onclick="alterarOdo(-0.010)">-10m</button>
                    <button class="btn-mini" onclick="alterarOdo(-0.001)">-1m</button>
                    <button class="btn-mini" onclick="zerarOdo()" style="background:#b30000;">ZERAR</button>
                    <button class="btn-mini" onclick="alterarOdo(0.001)">+1m</button>
                    <button class="btn-mini" onclick="alterarOdo(0.010)">+10m</button>
                </div>
            </div>

            <div class="roadbook-container" id="roadbookList">
                <div style="padding: 20px; color: #444; font-size: 11px; text-align: center;">CARREGANDO PLANILHA...</div>
            </div>

            <div class="status-container">
                <div id="msgGps" class="status-gps">● CONECTANDO...</div>
            </div>
        </div>
    </div>

    <script>
        // Lógica de Seleção de Categoria via Chips
        const categoryChips = document.querySelectorAll('.cat-chip');
        const hiddenCategoryInput = document.getElementById('categoria');

        categoryChips.forEach(chip => {
            chip.addEventListener('click', () => {
                categoryChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                hiddenCategoryInput.value = chip.getAttribute('data-value');
            });
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);

        window.__rk = window.__rk || {};
        window.__rk.firebase = firebase;
        window.__rk.db = db;

        let wakeLock = null;
        let watchID = null;
        let odoTotal = 0;      
        let tripOffset = 0;    
        let ultimaPos = null;
        let indiceTulipaAtual = 0; 
        let dadosRoadbookAtual = []; 

        let audioCtx = null;

        function obterAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function tocarBip(frequencia, duracao, volume = 0.1) {
            try {
                const ctx = obterAudioContext();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequencia, ctx.currentTime);
                gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duracao);
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + duracao);
                oscillator.onended = () => {
                    oscillator.disconnect();
                    gainNode.disconnect();
                };
            } catch (e) { console.error(e); }
        }

        const somClique = () => tocarBip(2000, 0.08, 0.1);
        const somTrocaReferencia = () => tocarBip(1200, 0.25, 0.15);

        const btnMenu = document.getElementById('btnMenu');
        const menuOpcoes = document.getElementById('menuOpcoes');

        btnMenu.onclick = (e) => {
            e.stopPropagation();
            menuOpcoes.style.display = menuOpcoes.style.display === 'block' ? 'none' : 'block';
        };

        window.onclick = () => {
            menuOpcoes.style.display = 'none';
        };

        async function enviarDatalogger() {
            menuOpcoes.style.display = 'none';
            
            if (window.__rk && window.__rk.enviarDataloggerNativo) {
                window.__rk.enviarDataloggerNativo();
                return;
            }

            const numCarro = window.__rk.carroAtivo || localStorage.getItem('rally_carro_ativo');
            if (!numCarro) {
                alert("Nenhum carro ativo identificado para enviar o datalogger.");
                return;
            }

            try {
                const dataloggerLocal = localStorage.getItem('rally_datalogger_' + numCarro);
                if (!dataloggerLocal) {
                    alert("Nenhum dado pendente no Datalogger.");
                    return;
                }

                const pontos = JSON.parse(dataloggerLocal);
                await db.ref('datalogger/' + numCarro).push({
                    dataEnvio: Date.now(),
                    pontos: pontos
                });

                localStorage.removeItem('rally_datalogger_' + numCarro);
                alert("Datalogger enviado com sucesso!");
            } catch (erro) {
                console.error("Erro ao enviar datalogger:", erro);
                alert("Falha ao enviar datalogger. Verifique sua conexão.");
            }
        }

        db.ref('configuracoes/comandoLogoff').on('value', (snap) => {
            const timestampLogoff = snap.val();
            const tempoLogin = localStorage.getItem('rally_timestamp_login') || 0;
            if (timestampLogoff && timestampLogoff > parseInt(tempoLogin) && localStorage.getItem('rally_carro_ativo')) {
                encerrarSessaoRemoto();
            }
        });

        function carregarRoadbook() {
            const rbList = document.getElementById('roadbookList');

            try {
                const planilhaSalva = localStorage.getItem('rally_planilha_cache');
                if (planilhaSalva) {
                    const dadosLocais = JSON.parse(planilhaSalva);
                    if (dadosLocais && dadosLocais.length) {
                        renderizarRoadbook(dadosLocais);
                    }
                }
            } catch (e) { console.error(e); }

            db.ref('prova_atual').on('value', (snapshot) => {
                const dados = snapshot.val();
                if (!dados) return;
                renderizarRoadbook(dados);
                try {
                    localStorage.setItem('rally_planilha_cache', JSON.stringify(dados));
                } catch (e) {}
            });
        }

        function renderizarRoadbook(dados) {
            dadosRoadbookAtual = dados;
            const rbList = document.getElementById('roadbookList');
            rbList.innerHTML = '';
            dados.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'roadbook-item';
                div.id = 'rb-item-' + index;
                div.onclick = () => selecionarTulipaManualmente(index);
                
                const imgUrl = item.tulipa || '';
                const obs = item.obs || '--';
                const km = parseFloat(item.km).toFixed(3);
                div.innerHTML = `
                    <div class="rb-col-km">${km}</div>
                    <div class="rb-col-tulipa">
                        ${imgUrl ? `<img src="${imgUrl}" onerror="this.style.display='none'">` : ''}
                    </div>
                    <div class="rb-col-obs">${obs}</div>
                `;
                rbList.appendChild(div);
            });
            destacarTulipa(indiceTulipaAtual, false);
        }

        function selecionarTulipaManualmente(index) {
            indiceTulipaAtual = index;
            destacarTulipa(index, true);
        }

               function destacarTulipa(index, tocarSom) {
            const todosItens = document.querySelectorAll('.roadbook-item');
            todosItens.forEach(el => el.classList.remove('rb-item-ativo'));

            const itemAlvo = document.getElementById('rb-item-' + index);
            if (itemAlvo) {
                itemAlvo.classList.add('rb-item-ativo');
                if (tocarSom) somTrocaReferencia();
                
                itemAlvo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function solicitarWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function processarPontoGps(num, lat, lng, accuracy, kmh) {
            if (accuracy > 25) return;

            if (ultimaPos) {
                const dist = calcularDistancia(ultimaPos.lat, ultimaPos.lng, lat, lng);
                if (dist > 0.004) {
                    odoTotal += dist;
                    atualizarTelaOdo();
                    ultimaPos = { lat, lng };
                }
            } else {
                ultimaPos = { lat, lng };
            }

            document.getElementById('viewVel').innerText = kmh.toFixed(1);
            const dados = { lat, lng, vel: kmh, acc: accuracy, ts: Date.now() };

            if (window.__rk && window.__rk.registrarPontoGps) {
                window.__rk.registrarPontoGps(num, dados);
            } else {
                db.ref('posicoes/' + num).set(dados);
                db.ref('rastros/' + num).push(dados);
            }
        }
        window.__rk = window.__rk || {};
        window.__rk.processarPontoGps = processarPontoGps;

        function iniciarFluxoRastreio(num) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('ativo').style.display = 'flex';
            document.getElementById('viewCarro').innerText = "Carro " + num;
            window.__rk.carroAtivo = num;
            solicitarWakeLock();

            db.ref(".info/connected").on("value", (snap) => {
                const msg = document.getElementById('msgGps');
                if (snap.val() === true) {
                    msg.innerText = "● TRANSMITINDO AO VIVO";
                    msg.classList.remove('status-offline');
                } else {
                    msg.innerText = "SEM INTERNET - DADOS PROTEGIDOS";
                    msg.classList.add('status-offline');
                }
            });

            if (window.__rk && window.__rk.iniciarGpsNativo) {
                window.__rk.iniciarGpsNativo(num);
            } else {
                watchID = navigator.geolocation.watchPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const speedMS = position.coords.speed || 0;
                    const kmh = Math.round(speedMS * 3.6);
                    processarPontoGps(num, lat, lng, accuracy, kmh);
                }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
            }
        }
        window.__rk.iniciarFluxoRastreio = iniciarFluxoRastreio;
        window.__rk.carregarRoadbook = carregarRoadbook;

        document.getElementById('btnIniciar').onclick = async function() {
            const numRaw = document.getElementById('carro').value;
            const nomeRaw = document.getElementById('nome').value.trim();
            const cat = document.getElementById('categoria').value;
            const num = parseInt(numRaw);
            if(!nomeRaw || !numRaw) return alert("Preencha todos os campos!");
            try {
                const statusSnap = await db.ref('configuracoes/provaAberta').once('value');
                if (statusSnap.val() !== true) return alert("🚫 A prova está fechada.");

                somClique();
                await db.ref('competidores/' + num).set({ nome: nomeRaw, categoria: cat });
                localStorage.setItem('rally_carro_ativo', num);
                localStorage.setItem('rally_timestamp_login', Date.now());

                iniciarFluxoRastreio(num);
                carregarRoadbook();
            } catch (e) { alert("Erro de conexão."); }
        };

        function alterarOdo(v) {
            odoTotal = Math.max(0, odoTotal + v);
            somClique();
            atualizarTelaOdo();
        }

        // Margem de tolerância em quilómetros (2.000m)
const TOLERANCIA_ZERAR_KM = 2.00; 

// Guarda a posição do GPS acumulada registrada no último zeramento
let odoUltimoZerar = 0;

function zerarOdo() {
    // Distância percorrida em KM desde o último zeramento
    const distPercorrida = Math.abs(odoTotal - odoUltimoZerar);

    // Registra o ponto absoluto atual para o próximo cálculo de 2km
    odoUltimoZerar = odoTotal;
    
    // Reseta o parcial visual para 0.000
    tripOffset = odoTotal;

    if (distPercorrida >= TOLERANCIA_ZERAR_KM) {
        // Se andou mais de 2.00km: Avança exatamente 1 posição na lista
        if (dadosRoadbookAtual && dadosRoadbookAtual.length > 0) {
            if (indiceTulipaAtual + 1 < dadosRoadbookAtual.length) {
                indiceTulipaAtual++;
            }
        }
    }
    // Se andou menos de 2.00km: Apenas zera o parcial e mantém a tulipa atual

    // Força o destaque visual da tulipa correta
    destacarTulipa(indiceTulipaAtual, true);
    
    // Toca o som de confirmação
    somClique();
    
    // Atualiza o display do odômetro SEM disparar o recálculo do scroll automático
    const odoExibicao = Math.max(0, odoTotal - tripOffset);
    document.getElementById('displayOdo').innerText = odoExibicao.toFixed(3);
}

function selecionarTulipaManualmente(index) {
    indiceTulipaAtual = index;
    
    // Ao clicar na tulipa, reseta a contagem de referência do parcial
    tripOffset = odoTotal;
    odoUltimoZerar = odoTotal;
    
    destacarTulipa(index, true);
    
    const odoExibicao = Math.max(0, odoTotal - tripOffset);
    document.getElementById('displayOdo').innerText = odoExibicao.toFixed(3);
}

function atualizarScrollRoadbook() {
    if (!dadosRoadbookAtual || dadosRoadbookAtual.length === 0) return;

    const odoExibicao = Math.max(0, odoTotal - tripOffset);

    if (indiceTulipaAtual + 1 < dadosRoadbookAtual.length) {
        const kmTulipaAtual = parseFloat(dadosRoadbookAtual[indiceTulipaAtual].km) || 0;
        const kmProximaTulipa = parseFloat(dadosRoadbookAtual[indiceTulipaAtual + 1].km) || 0;
        
        // Distância que deve ser percorrida neste trecho específico
        const trechoNecessario = kmProximaTulipa - kmTulipaAtual;

        // Só avança automaticamente pela rolagem do GPS se o parcial atingir a distância da próxima referência
        if (trechoNecessario > 0 && odoExibicao >= trechoNecessario) {
            indiceTulipaAtual++;
            destacarTulipa(indiceTulipaAtual, true);
            
            // Reajusta a referência para iniciar a contagem da nova tulipa
            tripOffset = odoTotal;
            odoUltimoZerar = odoTotal;
        }
    }
}

function atualizarTelaOdo() {
    const odoExibicao = Math.max(0, odoTotal - tripOffset);
    document.getElementById('displayOdo').innerText = odoExibicao.toFixed(3);
    
    // Verifica o avanço automático por distância percorrida
    atualizarScrollRoadbook();
}

        function atualizarTelaOdo() {
            const odoExibicao = Math.max(0, odoTotal - tripOffset);
            document.getElementById('displayOdo').innerText = odoExibicao.toFixed(3);
            atualizarScrollRoadbook();
        }

        function ajusteManualOdo() {
            const odoExibicao = Math.max(0, odoTotal - tripOffset);
            let n = prompt("Ajustar Odômetro (KM):", odoExibicao.toFixed(3));
            if(n !== null) {
                let val = parseFloat(n.replace(',','.'));
                if(!isNaN(val)) {
                    tripOffset = odoTotal - Math.max(0, val);
                    somClique();
                    atualizarTelaOdo();
                }
            }
        }

        function encerrarSessao() {
            menuOpcoes.style.display = 'none';
            const senha = prompt("Informe a senha para sair da prova:");
            if (senha === "123456") {
                pararGps();
                limparTudo();
                location.reload();
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        }

        function encerrarSessaoRemoto() {
            pararGps();
            limparTudo();
            alert("A organização encerrou a sessão.");
            location.reload();
        }

        function pararGps() {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            if (window.__rk && window.__rk.pararGpsNativo) window.__rk.pararGpsNativo();
        }

        async function limparTudo() {
            localStorage.removeItem('rally_carro_ativo');
            localStorage.removeItem('rally_timestamp_login');
        }

        function verRastro() {
            const num = window.__rk.carroAtivo || localStorage.getItem('rally_carro_ativo');
            if (!num) return;
            const url = `https://racekrono.github.io/adv/rastropiloto.html?carro=${encodeURIComponent(num)}`;
            window.open(url, '_blank');
        }

        (function restaurarSessaoWeb() {
          function tentar() {
            if (document.getElementById('ativo').style.display === 'flex') return;
            const carro = localStorage.getItem('rally_carro_ativo');
            if (!carro) return;
            const num = parseInt(carro);
            if (!num) return;
            try {
              iniciarFluxoRastreio(num);
              carregarRoadbook();
            } catch (e) {}
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tentar);
          } else {
            tentar();
          }
        })();
    </script>
