<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio de Fotos - Competidor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-xl font-bold mb-4 text-gray-800">Enviar Foto do Posto</h1>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Prova:</label>
            <select id="selectProva" class="w-full p-2 border rounded bg-white">
                <option value="">Carregando provas...</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Número do Carro / Moto:</label>
            <input type="text" id="numCompetidor" class="w-full p-2 border rounded" placeholder="Ex: 101">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Posto / PC:</label>
            <input type="text" id="numPosto" class="w-full p-2 border rounded" placeholder="Ex: PC-01">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Foto:</label>
            <input type="file" id="inputFoto" accept="image/*" capture="environment" class="w-full p-2 border rounded">
        </div>

        <div id="previewContainer" class="mb-4 hidden">
            <img id="imgPreview" class="w-full h-40 object-cover rounded border" alt="Preview">
        </div>

        <button id="btnEnviar" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Enviar Foto</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            storageBucket: "cronometro-rally.firebasestorage.app",
            messagingSenderId: "341731891354",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let imagemBase64 = "";

        async function carregarProvas() {
            const select = document.getElementById('selectProva');
            try {
                const snapshot = await get(ref(db, 'provas_fotos'));
                if (snapshot.exists()) {
                    select.innerHTML = '<option value="">Selecione a Prova</option>';
                    snapshot.forEach((child) => {
                        const opt = document.createElement('option');
                        opt.value = child.key;
                        opt.textContent = child.val().nome;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="">Nenhuma prova cadastrada</option>';
                }
            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="">Erro ao carregar provas</option>';
            }
        }

        carregarProvas();

        document.getElementById('inputFoto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imagemBase64 = ev.target.result;
                    document.getElementById('imgPreview').src = imagemBase64;
                    document.getElementById('previewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('btnEnviar').addEventListener('click', async () => {
            const provaId = document.getElementById('selectProva').value;
            const competidor = document.getElementById('numCompetidor').value.trim(); // Captura correta do número do carro/competidor
            const posto = document.getElementById('numPosto').value.trim();

            if (!provaId || !competidor || !posto || !imagemBase64) {
                alert('Preencha todos os campos e selecione uma foto.');
                return;
            }

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = "Enviando...";

            try {
                const novoEnvioRef = push(ref(db, 'envios_competidores'));
                await set(novoEnvioRef, {
                    provaId: provaId,
                    competidor: competidor, // Propriedade enviada de forma compatível com o painel do juiz
                    carro: competidor,       // Garantindo redundância para evitar que fique em branco na avaliação
                    posto: posto,
                    imagem: imagemBase64,
                    status: 'pendente',
                    enviadoEm: Date.now()
                });

                alert('Foto enviada com sucesso!');
                document.getElementById('numCompetidor').value = '';
                document.getElementById('numPosto').value = '';
                document.getElementById('inputFoto').value = '';
                document.getElementById('imgPreview').src = '';
                document.getElementById('previewContainer').classList.add('hidden');
                imagemBase64 = "";
            } catch (err) {
                console.error(err);
                alert('Erro ao enviar foto.');
            } finally {
                btn.disabled = false;
                btn.textContent = "Enviar Foto";
            }
        });
    </script>
</body>
</html>
