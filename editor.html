<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editor de Planilha - Race Krono</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 20px; }
        h2 { color: #f1c40f; }
        .container { display: flex; gap: 20px; }
        .painel-esquerdo { flex: 1; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .painel-direito { flex: 1; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; max-height: 80vh; overflow-y: auto; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #444; background: #252525; color: white; box-sizing: border-box; }
        button { background: #f1c40f; color: black; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #d4ac0d; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-add { background: #2ecc71; color: white; }
        .btn-add:hover { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; border: 1px solid #333; text-align: left; font-size: 14px; }
        th { background: #252525; color: #f1c40f; }
        tr:nth-child(even) { background: #1a1a1a; }
        .img-preview { max-width: 50px; max-height: 50px; background: white; border-radius: 4px; padding: 2px; }
    </style>
</head>
<body>

    <h2>Editor de Planilha de Rally (Suporte a Trechos/Zera)</h2>
    <hr style="border-color: #333;">

    <div class="container">
        <!-- FORMULÁRIO DE INSERÇÃO -->
        <div class="painel-esquerdo">
            <h3>Adicionar Nova Referência</h3>
            
            <label>Distância Parcial (em metros) desde a última tulipa:</label>
            <input type="number" id="metrosParcial" placeholder="Ex: 450 (andou 450 metros desde a última)" min="0">

            <label>URL da Imagem da Tulipa:</label>
            <input type="text" id="urlTulipa" placeholder="https://raw.githubusercontent.com/.../tulipa1.png">

            <label>Observação / Instrução:</label>
            <textarea id="obsTulipa" rows="3" placeholder="Ex: VIRAR À DIREITA NA CERCA / ZERAR ODÔMETRO"></textarea>

            <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px; cursor: pointer;">
                <input type="checkbox" id="chkZera" style="width: auto; margin-bottom: 0;"> 
                <strong style="color: #e74c3c;">Esta referência ZERA o odômetro para o próximo trecho</strong>
            </label>

            <button class="btn-add" onclick="adicionarPonto()">➕ Adicionar na Planilha</button>
            <br><br>
            <button onclick="salvarNoFirebase()" style="background: #3498db; color: white;">💾 Enviar e Publicar Prova (Firebase)</button>
            <button class="btn-danger" onclick="limparTodaPlanilha()">🗑️ Limpar Tudo</button>
        </div>

        <!-- VISUALIZAÇÃO DA PLANILHA EM TEMPO REAL -->
        <div class="painel-direito">
            <h3>Estrutura da Planilha Gerada</h3>
            <table>
                <thead>
                    <tr>
                        <th style="width: 70px;">KM</th>
                        <th style="width: 60px;">Tulipa</th>
                        <th>Observação</th>
                        <th style="width: 60px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaPlanilha">
                    <!-- Inserido via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
            authDomain: "cronometro-rally.firebaseapp.com",
            databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
            projectId: "cronometro-rally",
            appId: "1:341731891354:web:d0c34265be68015e98a723"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let planilhaMemoria = [];

        // Carrega planilha existente se houver no Firebase
        db.ref('prova_atual').once('value', (snapshot) => {
            if (snapshot.exists()) {
                planilhaMemoria = snapshot.val() || [];
                atualizarTabela();
            }
        });

        function adicionarPonto() {
            const metros = parseFloat(document.getElementById('metrosParcial').value) || 0;
            const tulipa = document.getElementById('urlTulipa').value.trim();
            let obs = document.getElementById('obsTulipa').value.trim();
            const eDeZerar = document.getElementById('chkZera').checked;

            if (planilhaMemoria.length === 0) {
                // Primeira tulipa obrigatoriamente começa em 0.000
                planilhaMemoria.push({ km: 0.000, tulipa: tulipa, obs: obs, zera: eDeZerar });
            } else {
                // Descobre qual o KM da tulipa anterior para calcular o acumulado do trecho
                const ultimaReferencia = planilhaMemoria[planilhaMemoria.length - 1];
                
                let kmCalculado = 0;
                
                // SE a tulipa anterior mandou ZERAR, esse novo ponto começa contando do zero absoluto + a distância dele
                if (ultimaReferencia.zera === true) {
                    kmCalculado = metros / 1000;
                } else {
                    // Senão, acumula normalmente em cima do KM anterior do trecho
                    kmCalculado = parseFloat(ultimaReferencia.km) + (metros / 1000);
                }

                if (eDeZerar && !obs.toUpperCase().includes("ZERA")) {
                    obs += " [ZERAR ODÔMETRO]";
                }

                planilhaMemoria.push({
                    km: parseFloat(kmCalculado.toFixed(3)),
                    tulipa: tulipa,
                    obs: obs,
                    zera: eDeZerar
                });
            }

            // Limpa os campos para a próxima digitação
            document.getElementById('metrosParcial').value = '';
            document.getElementById('urlTulipa').value = '';
            document.getElementById('obsTulipa').value = '';
            document.getElementById('chkZera').checked = false;

            atualizarTabela();
        }

        function atualizarTabela() {
            const tbody = document.getElementById('tabelaPlanilha');
            tbody.innerHTML = '';

            // Recalcula a cadeia inteira para garantir consistência caso itens tenham sido deletados
            let acumuladoTrecho = 0;
            for (let i = 0; i < planilhaMemoria.length; i++) {
                if (i === 0) {
                    planilhaMemoria[i].km = 0.000;
                } else {
                    // Se o item anterior resetou, este atual não usa o acumulado passado
                    // Nota: Para recalculagem correta em deleções simples, o ideal é guardar os parciais originais, 
                    // mas para este fluxo direto a tabela manterá os valores fixados na inserção.
                }

                const item = planilhaMemoria[i];
                const tr = document.createElement('tr');
                if (item.zera) tr.style.borderLeft = "5px solid #e74c3c";

                tr.innerHTML = `
                    <td style="font-family:monospace; font-weight:bold; color:#f1c40f;">${parseFloat(item.km).toFixed(3)}</td>
                    <td>${item.tulipa ? `<img src="${item.tulipa}" class="img-preview">` : '—'}</td>
                    <td style="text-transform:uppercase; font-size:12px;">${item.obs} ${item.zera ? '🔥 <b>(ZERA TRECHO)</b>' : ''}</td>
                    <td><button class="btn-danger" style="padding:4px 8px; font-size:11px; margin:0;" onclick="removerPonto(${i})">X</button></td>
                `;
                tbody.appendChild(tr);
            }
        }

        function removerPonto(index) {
            if (confirm("Remover esta referência?")) {
                planilhaMemoria.splice(index, 1);
                // Como lidamos com trechos dinâmicos, o ideal após uma deleção complexa é reconstruir o grid
                atualizarTabela();
            }
        }

        function limparTodaPlanilha() {
            if (confirm("⚠️ ATENÇÃO: Isso apagará todas as linhas criadas na tela. Confirma?")) {
                planilhaMemoria = [];
                atualizarTabela();
            }
        }

        async function salvarNoFirebase() {
            if (planilhaMemoria.length === 0) return alert("Adicione ao menos uma tulipa antes de salvar!");
            
            if (confirm(`Deseja publicar esta planilha com ${planilhaMemoria.length} referências direto para os competidores?`)) {
                try {
                    await db.ref('prova_atual').set(planilhaMemoria);
                    alert("🚀 Planilha enviada com Sucesso! Os tablets/celulares dos pilotos já foram atualizados via nuvem.");
                } catch (e) {
                    alert("Erro ao salvar no Firebase: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
