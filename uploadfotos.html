<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competidor - Envio de Fotos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase v9 Compat SDKs (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2 text-white">
        <span>🏁</span> CARREGUE SUAS FOTOS
      </h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">

    <!-- PASSO 1: IDENTIFICAÇÃO DO COMPETIDOR -->
    <section id="step-1" class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-700">
        <span class="w-8 h-8 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-sm">1</span>
        <div>
          <h2 class="text-lg font-bold text-white">Identificação do Competidor</h2>
          <p class="text-xs text-slate-400" id="subtitulo-identificacao">Buscando prova ativa...</p>
        </div>
      </div>

      <form id="form-step-1" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-1">Número do Carro / Equipe</label>
          <input type="number" id="numero-carro" min="1" required placeholder="Ex: 42" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-emerald-500 outline-none text-lg font-bold">
        </div>

        <button type="submit" id="btn-iniciar" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition shadow-sm flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span>Iniciar Envio das Fotos</span>
          <span>→</span>
        </button>
      </form>
    </section>

    <!-- PASSO 2: UPLOAD DAS FOTOS -->
    <section id="step-2" class="hidden space-y-6">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider" id="info-carro">Carro #--</span>
          <h2 id="info-prova" class="text-lg font-bold text-white">--</h2>
        </div>
        <button id="btn-trocar-carro" type="button" class="text-xs text-emerald-400 hover:underline font-semibold">
          Alterar número do carro
        </button>
      </div>

      <form id="form-step-2" class="space-y-6">
        <div id="container-tarefas" class="space-y-6"></div>

        <div id="status-container" class="hidden bg-slate-800 text-white p-4 rounded-xl shadow-md text-center space-y-2 border border-slate-700">
          <p id="status-texto" class="text-sm font-medium">Processando e enviando fotos...</p>
          <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div id="status-barra" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700 flex justify-end">
          <button type="submit" id="btn-enviar-tudo" class="w-full md:w-auto px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition shadow-sm flex items-center justify-center gap-2">
            <span>🚀 Enviar Minhas Fotos para Avaliação</span>
          </button>
        </div>
      </form>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPJkehV9C1x0hiY5dQSwSRtVf5c4P2JGE",
      databaseURL: "https://cronometro-rally-default-rtdb.firebaseio.com",
      projectId: "cronometro-rally"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let provaAtiva = null;
    let numeroCarroGlobal = "";

    async function carregarProvaAtiva() {
      const subtitulo = document.getElementById('subtitulo-identificacao');
      const btnIniciar = document.getElementById('btn-iniciar');

      try {
        db.ref('provas').orderByChild('criado_em').limitToLast(1).once('value', (snapshot) => {
          if (!snapshot.exists()) {
            subtitulo.textContent = "Nenhuma prova cadastrada no momento.";
            subtitulo.className = "text-xs text-rose-400 font-semibold";
            return;
          }

          snapshot.forEach((childSnap) => {
            provaAtiva = { id: childSnap.key, ...childSnap.val() };
          });

          const totalTarefas = provaAtiva.tarefas ? provaAtiva.tarefas.length : 0;
          subtitulo.textContent = `Prova Ativa: ${provaAtiva.nome_prova} (${totalTarefas} fotos)`;
          subtitulo.className = "text-xs text-emerald-400 font-semibold";
          btnIniciar.disabled = false;
        });
      } catch (err) {
        console.error("Erro ao carregar prova ativa:", err);
        subtitulo.textContent = "Erro ao conectar com o servidor.";
        subtitulo.className = "text-xs text-rose-400 font-semibold";
      }
    }

    carregarProvaAtiva();

    document.getElementById('form-step-1').addEventListener('submit', (e) => {
      e.preventDefault();
      numeroCarroGlobal = document.getElementById('numero-carro').value;

      if (!provaAtiva || !numeroCarroGlobal) return;

      document.getElementById('info-carro').textContent = `Carro / Equipe #${numeroCarroGlobal}`;
      document.getElementById('info-prova').textContent = provaAtiva.nome_prova;

      gerarCamposDeEnvio(provaAtiva.tarefas);

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('btn-trocar-carro').addEventListener('click', () => {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    });

    function gerarCamposDeEnvio(tarefas) {
      const container = document.getElementById('container-tarefas');
      container.innerHTML = '';

      tarefas.forEach((tarefa, index) => {
        const numTarefa = tarefa.ordem || (index + 1);
        const card = document.createElement('div');
        card.className = "bg-slate-800 p-6 rounded-xl shadow-md border border-slate-700 space-y-4";

        card.innerHTML = `
          <div class="flex items-center justify-between pb-3 border-b border-slate-700">
            <h3 class="font-bold text-white text-lg flex items-center gap-2">
              <span class="bg-emerald-900 text-emerald-300 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">${numTarefa}</span>
              Foto / Tarefa #${numTarefa}
            </h3>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Gabarito de Referência:</p>
              <img src="${tarefa.foto_gabarito_url}" class="h-44 w-full object-cover rounded-lg border border-slate-700 bg-slate-900" alt="Referência">
            </div>

            <div class="space-y-3">
              <label class="block text-sm font-semibold text-slate-300">Sua Foto Realizada</label>
              <input type="file" id="foto_competidor_${numTarefa}" required accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:bg-slate-700 file:text-emerald-300 hover:file:bg-slate-600 cursor-pointer border border-slate-700 rounded-lg p-1">
              
              <div id="preview-box-comp-${numTarefa}" class="hidden mt-2">
                <p class="text-xs text-slate-400 mb-1">Pré-visualização da sua foto:</p>
                <img id="preview-img-comp-${numTarefa}" src="" class="h-44 w-full object-cover rounded-lg border border-slate-700">
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);

        const inputImg = document.getElementById(`foto_competidor_${numTarefa}`);
        inputImg.addEventListener('change', (e) => {
          const file = e.target.files[0];
          const previewBox = document.getElementById(`preview-box-comp-${numTarefa}`);
          const previewImg = document.getElementById(`preview-img-comp-${numTarefa}`);
          if (file) {
            previewImg.src = URL.createObjectURL(file);
            previewBox.classList.remove('hidden');
          }
        });
      });
    }

    function otimizarImagemBase64(file, maxWidth = 1024, maxQuality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', maxQuality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('form-step-2').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnEnviar = document.getElementById('btn-enviar-tudo');
      const statusContainer = document.getElementById('status-container');
      const statusTexto = document.getElementById('status-texto');
      const statusBarra = document.getElementById('status-barra');

      btnEnviar.disabled = true;
      btnEnviar.classList.add('opacity-50', 'cursor-not-allowed');
      statusContainer.classList.remove('hidden');

      try {
        const respostasArr = [];
        const totalTarefas = provaAtiva.tarefas.length;

        for (let i = 0; i < totalTarefas; i++) {
          const numTarefa = provaAtiva.tarefas[i].ordem || (i + 1);
          
          statusTexto.textContent = `Otimizando sua foto ${i + 1} de ${totalTarefas}...`;
          statusBarra.style.width = `${Math.round(((i) / totalTarefas) * 80)}%`;

          const fileInput = document.getElementById(`foto_competidor_${numTarefa}`);
          const file = fileInput.files[0];
          const fotoBase64 = await otimizarImagemBase64(file);

          respostasArr.push({
            ordem: numTarefa,
            foto_competidor_url: fotoBase64,
            foto_gabarito_url: provaAtiva.tarefas[i].foto_gabarito_url,
            regras: {
              pontos: provaAtiva.tarefas[i].pontos || 100,
              qtd_competidores: provaAtiva.tarefas[i].qtd_competidores,
              exigir_carro: provaAtiva.tarefas[i].exigir_carro,
              pegadinhas: provaAtiva.tarefas[i].pegadinhas || ""
            }
          });
        }

        statusTexto.textContent = "Salvando envio no banco de dados...";
        statusBarra.style.width = "90%";

        const novoEnvioRef = db.ref('envios_competidores').push();
        await novoEnvioRef.set({
          prova_id: provaAtiva.id,
          nome_prova: provaAtiva.nome_prova,
          numero_carro: numeroCarroGlobal,
          respostas: respostasArr,
          status_avaliacao: "pendente",
          enviado_em: firebase.database.ServerValue.TIMESTAMP
        });

        statusBarra.style.width = "100%";
        statusTexto.textContent = "✅ Fotos enviadas com sucesso!";

        setTimeout(() => {
          alert("Suas fotos foram salvas com sucesso e enviadas para avaliação!");
          location.reload();
        }, 1200);

      } catch (error) {
        console.error("Erro ao enviar respostas:", error);
        alert("Erro ao enviar fotos: " + error.message);
        btnEnviar.disabled = false;
        btnEnviar.classList.remove('opacity-50', 'cursor-not-allowed');
        statusContainer.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
