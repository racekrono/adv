<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gincana Snap - Envio de Provas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="camera" class="w-6 h-6 text-indigo-400"></i>
        <h1 class="text-xl font-bold text-white">Gincana Snap</h1>
      </div>
      <span class="text-xs bg-indigo-500/20 text-indigo-300 font-semibold px-2.5 py-1 rounded-full border border-indigo-500/30">Validação IA</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col justify-center">
    <form id="uploadForm" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-5">
      
      <div>
        <h2 class="text-lg font-bold text-white mb-1">Enviar Prova de Tarefa</h2>
        <p class="text-sm text-slate-400">Envie a foto do local. O sistema validará se o cenário e o número de competidores correspondem ao gabarito.</p>
      </div>

      <!-- Equipe -->
      <div>
        <label for="teamSelect" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">1. Selecione sua Equipe</label>
        <select id="teamSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="" disabled selected>Escolha a equipe...</option>
          <option value="Equipe Azul">Equipe Azul</option>
          <option value="Equipe Vermelha">Equipe Vermelha</option>
          <option value="Equipe Amarela">Equipe Amarela</option>
          <option value="Equipe Verde">Equipe Verde</option>
        </select>
      </div>

      <!-- Tarefa -->
      <div>
        <label for="taskSelect" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">2. Selecione a Tarefa</label>
        <select id="taskSelect" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="" disabled selected>Carregando tarefas...</option>
        </select>
      </div>

      <!-- Área de Foto -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">3. Tirar ou Selecionar Foto</label>
        <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" required>
        
        <div onclick="document.getElementById('photoInput').click()" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer bg-slate-900/50 hover:bg-slate-900 transition flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden">
          <img id="imagePreview" src="" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl">
          <div id="uploadPrompt" class="flex flex-col items-center space-y-2">
            <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-full">
              <i data-lucide="camera" class="w-8 h-8"></i>
            </div>
            <p class="text-sm font-medium text-slate-300">Toque para abrir a câmera</p>
            <p class="text-xs text-slate-500">ou escolha da galeria</p>
          </div>
        </div>
      </div>

      <!-- Modal/Card de Resultado da IA -->
      <div id="resultCard" class="hidden border rounded-xl p-4 space-y-2">
        <div class="flex items-center space-x-2 font-bold text-sm" id="resultHeader"></div>
        <p id="resultBody" class="text-xs text-slate-300 leading-relaxed"></p>
      </div>

      <!-- Botão Enviar -->
      <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 disabled:opacity-50">
        <i data-lucide="send" class="w-5 h-5"></i>
        <span>Enviar e Validar Foto</span>
      </button>
    </form>
  </main>

  <footer class="p-4 text-center text-xs text-slate-500">
    Gincana Snap &copy; 2026 - Sistema com Validação Automática por IA
  </footer>

  <!-- Firebase & Google Gen AI SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, getDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    const firebaseConfig = {
      apiKey: "SEU_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const GEMINI_API_KEY = "SUA_GEMINI_API_KEY"; // Cole sua chave de API do Google AI Studio

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
    lucide.createIcons();

    const photoInput = document.getElementById('photoInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const uploadForm = document.getElementById('uploadForm');
    const taskSelect = document.getElementById('taskSelect');
    const btnSubmit = document.getElementById('btnSubmit');
    const resultCard = document.getElementById('resultCard');
    const resultHeader = document.getElementById('resultHeader');
    const resultBody = document.getElementById('resultBody');

    let tarefasCache = {};

    // Carregar tarefas dinamicamente do banco
    onSnapshot(collection(db, "tarefas"), (snapshot) => {
      taskSelect.innerHTML = `<option value="" disabled selected>Escolha a tarefa...</option>`;
      snapshot.forEach((documento) => {
        const t = documento.data();
        tarefasCache[documento.id] = t;
        taskSelect.innerHTML += `<option value="${documento.id}">${t.titulo} (${t.pontos} Pts)</option>`;
      });
    });

    // Preview
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          imagePreview.src = event.target.result;
          imagePreview.classList.remove('hidden');
          uploadPrompt.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Função para converter File para Base64
    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    // Função para buscar imagem do Gabarito e converter em Base64
    async function urlToBase64(url) {
      const response = await fetch(url);
      const blob = await response.blob();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // Submissão
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const team = document.getElementById('teamSelect').value;
      const taskId = taskSelect.value;
      const file = photoInput.files[0];

      if (!file || !taskId) return;

      setLoading(true);
      resultCard.classList.add('hidden');

      try {
        const tarefa = tarefasCache[taskId];

        // 1. Converte imagens para base64
        const envioBase64 = await fileToBase64(file);
        const gabaritoBase64 = await urlToBase64(tarefa.gabaritoUrl);

        // 2. Chamada à API Gemini 2.5 Flash para comparar o local e competidores
        const prompt = `
        Você é o validador automático de uma gincana fotográfica.
        
        A FOTO 1 é o gabarito oficial do local.
        A FOTO 2 foi enviada pelo participante.

        REGRAS A AVALIAR:
        1. LOCALIZAÇÃO: O cenário/fundo da FOTO 2 corresponde ao MESMO LOCAL da FOTO 1? (Seja tolerante com variações normais de fotografia de celular como iluminação, ângulo e enquadramento, focando em elementos visuais fixos).
        2. COMPETIDORES: A FOTO 2 contém exatamente ${tarefa.qtdCompetidores} competidor(es) em destaque?

        Responda EXCLUSIVAMENTE em formato JSON:
        {
          "mesmo_local": true ou false,
          "competidores_detectados": número,
          "aprovado": true ou false,
          "motivo": "Explicação objetiva da decisão"
        }
        `;

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: [
            {
              role: 'user',
              parts: [
                { text: prompt },
                { inlineData: { mimeType: 'image/jpeg', data: gabaritoBase64 } },
                { inlineData: { mimeType: 'image/jpeg', data: envioBase64 } }
              ]
            }
          ],
          config: { responseMimeType: "application/json" }
        });

        const avaliacao = JSON.parse(response.text);

        // 3. Salva no Storage e Firestore
        const fileName = `envios/${Date.now()}_${file.name}`;
        const storageRef = ref(storage, fileName);
        await uploadBytes(storageRef, file);
        const envUrl = await getDownloadURL(storageRef);

        const pontosGanhos = avaliacao.aprovado ? tarefa.pontos : 0;

        await addDoc(collection(db, "submissoes"), {
          equipe: team,
          tarefaId: taskId,
          tarefaTitulo: tarefa.titulo,
          fotoUrl: envUrl,
          aprovado: avaliacao.aprovado,
          pontosGanhos: pontosGanhos,
          motivoIA: avaliacao.motivo,
          enviadoEm: serverTimestamp()
        });

        // 4. Exibe Resultado Visual
        displayResult(avaliacao, pontosGanhos);

      } catch (err) {
        console.error("Erro na validação:", err);
        alert("Erro ao validar foto. Tente novamente.");
      } finally {
        setLoading(false);
      }
    });

    function displayResult(res, pontos) {
      resultCard.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'bg-rose-500/10', 'border-rose-500/30');
      
      if (res.aprovado) {
        resultCard.classList.add('bg-emerald-500/10', 'border-emerald-500/30');
        resultHeader.className = "flex items-center space-x-2 font-bold text-sm text-emerald-400";
        resultHeader.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> <span>Aprovado! +${pontos} Pontos</span>`;
      } else {
        resultCard.classList.add('bg-rose-500/10', 'border-rose-500/30');
        resultHeader.className = "flex items-center space-x-2 font-bold text-sm text-rose-400";
        resultHeader.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5"></i> <span>Foto Não Aprovada (0 Pts)</span>`;
      }

      resultBody.textContent = res.motivo;
      lucide.createIcons();
    }

    function setLoading(isLoading) {
      btnSubmit.disabled = isLoading;
      btnSubmit.querySelector('span').textContent = isLoading ? "Avaliando Imagem via IA..." : "Enviar e Validar Foto";
    }
  </script>
</body>
</html>
